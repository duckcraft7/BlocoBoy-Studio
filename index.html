<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NanoBoy Maker - Google Blockly</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed"></script>
  <style>
    body { background: #1e1e1e; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #333; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ff88; }
    .main { display: flex; flex: 1; }
    #blocklyDiv { flex: 3; }
    #codeSide { flex: 1; background: #252526; padding: 15px; display: flex; flex-direction: column; border-left: 2px solid #000; }
    textarea { flex: 1; background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; border: 1px solid #444; margin-top: 10px; }
    .btn { background: #00ff88; color: black; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <h2>NanoBoy Maker 🕹️</h2>
  <button class="btn" onclick="exportar()">GERAR CÓDIGO ARDUINO</button>
</header>

<div class="main">
  <div id="blocklyDiv"></div>
  <div id="codeSide">
    <h3 style="margin:0">Código C++ (Copie para o Wokwi)</h3>
    <textarea id="outputCode" readonly></textarea>
  </div>
</div>

<xml id="toolbox" style="display: none">
  <category name="Lógica" colour="210">
    <block type="controls_if"></block>
    <block type="logic_compare"></block>
    <block type="logic_operation"></block>
    <block type="logic_boolean"></block>
  </category>
  <category name="Loops" colour="120">
    <block type="controls_repeat_ext"></block>
    <block type="controls_whileUntil"></block>
  </category>
  <category name="Matemática" colour="230">
    <block type="math_number"></block>
    <block type="math_arithmetic"></block>
    <block type="math_random_int"></block>
  </category>
  <category name="Variáveis" colour="330" custom="VARIABLE"></category>
  <sep></sep>
  <category name="NanoBoy (Hardware)" colour="160">
    <block type="nano_draw_rect"></block>
    <block type="nano_btn_pressed"></block>
    <block type="nano_clear"></block>
  </category>
</xml>

<script>
// 1. DEFINIR OS BLOCOS DE CONEXÃO COM O ARDUINO
Blockly.defineBlocksWithJsonArray([
  {
    "type": "nano_draw_rect",
    "message0": "Desenhar Retângulo X: %1 Y: %2 L: %3 A: %4",
    "args0": [
      { "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" },
      { "type": "input_value", "name": "W" }, { "type": "input_value", "name": "H" }
    ],
    "previousStatement": null, "nextStatement": null, "colour": 160
  },
  {
    "type": "nano_btn_pressed",
    "message0": "Botão %1 pressionado?",
    "args0": [
      { "type": "field_dropdown", "name": "PIN", "options": [["Pulo (D2)", "2"], ["Esquerda (D3)", "3"], ["Direita (D4)", "4"]] }
    ],
    "output": "Boolean", "colour": 160
  },
  {
    "type": "nano_clear",
    "message0": "Limpar Tela",
    "previousStatement": null, "nextStatement": null, "colour": 160
  }
]);

// 2. CONFIGURAR O GERADOR DE C++ (Simulado via JavaScript)
const workspace = Blockly.inject('blocklyDiv', {
  toolbox: document.getElementById('toolbox'),
  theme: 'dark'
});

function exportar() {
  // Traduz os blocos para uma lógica de texto simples
  const code = Blockly.JavaScript.workspaceToCode(workspace);
  
  // Limpa o código JS para parecer C++ de Arduino
  let finalCpp = code.replace(/var /g, "int ").replace(/;/g, ";\n");

  const template = `
#include <Adafruit_SSD1306.h>
Adafruit_SSD1306 d(128, 64, &Wire, -1);

void setup() {
  d.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  pinMode(2, INPUT_PULLUP); // Pulo
  pinMode(3, INPUT_PULLUP); // Esq
  pinMode(4, INPUT_PULLUP); // Dir
}

void loop() {
  d.clearDisplay();
  
  // LÓGICA DO USUÁRIO
  ${finalCpp}
  
  d.display();
  delay(20);
}

// Funções de ponte para os blocos
void drawRect(int x, int y, int w, int h) { d.fillRect(x, y, w, h, WHITE); }
`;
  document.getElementById('outputCode').value = template;
}

// Lógica de tradução dos blocos customizados
Blockly.JavaScript['nano_draw_rect'] = function(block) {
  var x = Blockly.JavaScript.valueToCode(block, 'X', 0) || 0;
  var y = Blockly.JavaScript.valueToCode(block, 'Y', 0) || 0;
  var w = Blockly.JavaScript.valueToCode(block, 'W', 0) || 4;
  var h = Blockly.JavaScript.valueToCode(block, 'H', 0) || 4;
  return `d.fillRect(${x}, ${y}, ${w}, ${h}, WHITE);\n`;
};

Blockly.JavaScript['nano_btn_pressed'] = function(block) {
  var pin = block.getFieldValue('PIN');
  return [`(digitalRead(${pin}) == LOW)`, 0];
};

Blockly.JavaScript['nano_clear'] = function(block) { return `d.clearDisplay();\n`; };
</script>
</body>
</html>
