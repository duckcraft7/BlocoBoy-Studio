<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NanoBoy Engine Pro - Realismo & Game Over</title>
    <style>
        :root { --main: #00d2ff; --bg: #111; --panel: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); }
        .container { display: flex; flex: 1; overflow: hidden; }
        
        /* Paleta de Blocos */
        #palette { width: 280px; background: #252526; padding: 15px; border-right: 2px solid #000; overflow-y: auto; }
        .block { padding: 10px; margin-bottom: 8px; border-radius: 4px; cursor: grab; font-size: 12px; font-weight: bold; color: #000; border-left: 6px solid rgba(0,0,0,0.3); }
        .b-sys { background: #ff4757; }   /* Sistema/GameOver */
        .b-flappy { background: #eccc68; } /* Flappy Bird */
        .b-tetris { background: #70a1ff; } /* Tetris */

        /* Área de Trabalho */
        #workspace { flex: 1; background: #1a1a1a; padding: 20px; overflow-y: auto; border: 2px dashed #333; margin: 10px; border-radius: 8px; }
        
        /* Preview e Saída */
        #output-side { width: 380px; background: var(--panel); padding: 20px; border-left: 2px solid #000; display: flex; flex-direction: column; }
        canvas { background: #000; width: 100%; height: 150px; image-rendering: pixelated; border: 4px solid #444; border-radius: 4px; }
        textarea { width: 100%; flex: 1; background: #000; color: #00ff88; font-family: 'Consolas', monospace; font-size: 11px; margin-top: 15px; padding: 10px; border: 1px solid #333; outline: none; }
        .btn { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; background: var(--main); color: #000; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0">NanoBoy Script V5 🕹️</h2>
    <button class="btn" onclick="gerarCodigo()">COMPILAR PARA NANO</button>
</header>

<div class="container">
    <div id="palette">
        <h3>Sistema</h3>
        <div class="block b-sys" draggable="true" data-type="game_over">🚩 Criar Tela Game Over</div>
        
        <h3>Mecânicas Flappy</h3>
        <div class="block b-flappy" draggable="true" data-type="flap_phys">🕊️ Física: Gravidade Real</div>
        <div class="block b-flappy" draggable="true" data-type="flap_pipe">🚧 Canos com Vão Real</div>
        
        <h3>Mecânicas Tetris</h3>
        <div class="block b-tetris" draggable="true" data-type="tet_matrix">🔳 Matriz de Colisão (Grid)</div>
        <div class="block b-tetris" draggable="true" data-type="tet_line">🧹 Limpar Linha Completa</div>
    </div>

    <div id="workspace" ondragover="event.preventDefault()" ondrop="drop(event)">
        <p style="color:#555">Arraste a lógica do seu jogo aqui...</p>
    </div>

    <div id="output-side">
        <canvas id="gameSim" width="128" height="64"></canvas>
        <div style="margin-top:10px; display:flex; gap:10px">
            <button class="btn" style="background:#2ed573" onclick="rodarSimulacao()">TESTAR JOGO</button>
            <button class="btn" style="background:#ff4757" onclick="location.reload()">LIMPAR</button>
        </div>
        <textarea id="arduinoCode" readonly placeholder="O código C++ otimizado aparecerá aqui..."></textarea>
    </div>
</div>

<script>
    let blocksInWorkspace = [];
    let state = "PLAY"; // PLAY ou GAMEOVER

    function drop(e) {
        e.preventDefault();
        const type = e.dataTransfer.getData("type");
        const block = document.createElement("div");
        block.className = "block " + e.srcElement.className;
        block.innerHTML = e.dataTransfer.getData("text") + " <span onclick='this.parentElement.remove()' style='float:right'>×</span>";
        block.dataset.type = type;
        document.getElementById("workspace").appendChild(block);
    }

    document.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData("type", e.target.dataset.type);
        e.dataTransfer.setData("text", e.target.innerText);
    });

    // --- SIMULADOR DE PREVIEW ---
    function rodarSimulacao() {
        const ctx = document.getElementById('gameSim').getContext('2d');
        const activeBlocks = Array.from(document.getElementById('workspace').querySelectorAll('.block')).map(b => b.dataset.type);
        
        let py = 32, pv = 0, px = 128;
        state = "PLAY";

        let loop = setInterval(() => {
            ctx.fillStyle = "#000";
            ctx.fillRect(0,0,128,64);

            if(state === "PLAY") {
                activeBlocks.forEach(t => {
                    if(t === 'flap_phys') { pv += 0.2; py += pv; }
                    if(t === 'flap_pipe') { 
                        px -= 2; if(px < -10) px = 128;
                        ctx.fillStyle = "#fff";
                        ctx.fillRect(px, 0, 8, 20); // Cano topo
                        ctx.fillRect(px, 45, 8, 20); // Cano base
                    }
                });

                ctx.fillStyle = "#00d2ff";
                ctx.fillRect(20, py, 4, 4);

                // Colisão simples para testar Game Over
                if(py > 60 || py < 0 || (px < 24 && px > 16 && (py < 20 || py > 45))) {
                    if(activeBlocks.includes('game_over')) state = "GAMEOVER";
                    else { py = 32; pv = 0; px = 128; } // Reset simples se não tiver bloco Game Over
                }
            } else {
                ctx.fillStyle = "white";
                ctx.font = "12px Arial";
                ctx.fillText("GAME OVER", 30, 35);
                ctx.font = "8px Arial";
                ctx.fillText("Clique em Testar para reiniciar", 15, 50);
            }
        }, 30);
    }

    // --- GERADOR DE C++ OTIMIZADO PARA NANO ---
    function gerarCodigo() {
        const activeBlocks = Array.from(document.getElementById('workspace').querySelectorAll('.block')).map(b => b.dataset.type);
        
        let vars = "uint8_t st=0; // 0:Play, 1:GameOver\nint8_t y=32, v=0; uint8_t px=127, ph=20;";
        let logic = "";

        if(activeBlocks.includes('tet_matrix')) vars += "\nuint8_t grid[16][8] = {0}; // Matriz Tetris";

        activeBlocks.forEach(t => {
            if(t === 'flap_phys') logic += "    v += 1; y += v/4; if(digitalRead(2)==LOW) v = -8;\n";
            if(t === 'flap_pipe') logic += "    px--; if(px==0) { px=127; ph=random(10,35); }\n";
            if(t === 'game_over') logic += "    if(y>60 || y<0) st=1; // Ativa Game Over\n";
        });

        const fullCode = `
#include <Adafruit_SSD1306.h>
Adafruit_SSD1306 d(128, 64, &Wire, -1);

${vars}

void setup() {
  d.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  pinMode(2, INPUT_PULLUP); // Botao de ação
}

void loop() {
  d.clearDisplay();
  
  if(st == 0) { // ESTADO: JOGANDO
${logic}
    d.fillRect(20, y, 4, 4, WHITE); // Player
    d.fillRect(px, 0, 8, ph, WHITE); // Cano Cima
    d.fillRect(px, ph+25, 8, 64, WHITE); // Cano Baixo
  } 
  else { // ESTADO: GAME OVER
    d.setCursor(35, 25);
    d.print("GAME OVER");
    if(digitalRead(2) == LOW) { y=32; v=0; px=127; st=0; } // Reiniciar
  }

  d.display();
  delay(20);
}`;
        document.getElementById('arduinoCode').value = fullCode;
    }
</script>
</body>
</html>
