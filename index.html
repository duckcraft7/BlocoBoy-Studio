<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NanoBoy Maker - Crie e Compartilhe</title>
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 10px; background: #333; display: flex; justify-content: space-between; align-items: center; }
        #main { display: flex; flex: 1; }
        #blocklyDiv { flex: 3; border-right: 2px solid #444; }
        #sidebar { flex: 1; padding: 15px; overflow-y: auto; background: #252526; }
        button { cursor: pointer; padding: 10px; border: none; border-radius: 5px; font-weight: bold; }
        .btn-green { background: #28a745; color: white; }
        .btn-blue { background: #007bff; color: white; margin-top: 10px; width: 100%; }
        .game-card { background: #3c3c3c; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        pre { background: #000; padding: 10px; font-size: 10px; color: #0f0; max-height: 200px; overflow: auto; }
    </style>
</head>
<body>

<header>
    <h1>NanoBoy Maker 🕹️</h1>
    <div>
        <button class="btn-green" onclick="publicarJogo()">Publicar Jogo</button>
    </div>
</header>

<div id="main">
    <div id="blocklyDiv"></div>

    <div id="sidebar">
        <h3>Galeria da Comunidade</h3>
        <div id="galeria">
            <p style="color: #888;">Nenhum jogo publicado ainda...</p>
        </div>
        
        <hr>
        <h3>Código Arduino/Wokwi</h3>
        <button class="btn-blue" onclick="exportarCodigo()">Gerar Código C++</button>
        <pre id="codigoC++">// O código aparecerá aqui...</pre>
    </div>
</div>

<script>
// 1. DEFINIÇÃO DOS BLOCOS CUSTOMIZADOS
Blockly.defineBlocksWithJsonArray([
  {
    "type": "movimentar_player",
    "message0": "Mover Player x: %1 y: %2",
    "args0": [{ "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }],
    "previousStatement": null, "nextStatement": null, "colour": 230
  },
  {
    "type": "ao_pressionar_botao",
    "message0": "Se botão %1 for pressionado",
    "args0": [{
      "type": "field_dropdown", "name": "BTN",
      "options": [["Cima", "2"], ["Baixo", "3"], ["Esquerda", "4"], ["Direita", "5"], ["A", "6"]]
    }],
    "message1": "faça %1",
    "args1": [{ "type": "input_statement", "name": "DO" }],
    "previousStatement": null, "nextStatement": null, "colour": 20
  },
  {
      "type": "desenhar_pixel",
      "message0": "Desenhar Ponto em x: %1 y: %2",
      "args0": [{ "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }],
      "previousStatement": null, "nextStatement": null, "colour": 160
  }
]);

// 2. LÓGICA DO GERADOR DE C++
const cppGenerator = new Blockly.Generator('C++');
cppGenerator['movimentar_player'] = function(block) {
  var x = cppGenerator.valueToCode(block, 'X', 0) || '0';
  var y = cppGenerator.valueToCode(block, 'Y', 0) || '0';
  return `playerX += ${x}; playerY += ${y};\n`;
};
cppGenerator['ao_pressionar_botao'] = function(block) {
  var btn = block.getFieldValue('BTN');
  var branch = cppGenerator.statementToCode(block, 'DO');
  return `if(digitalRead(${btn}) == LOW) {\n${branch}}\n`;
};
cppGenerator['math_number'] = function(block) { return [block.getFieldValue('NUM'), 0]; };

// 3. INICIALIZAÇÃO DO BLOCKLY
var workspace = Blockly.inject('blocklyDiv', {
    toolbox: {
        'kind': 'categoryToolbox',
        'contents': [
            { 'kind': 'category', 'name': 'Movimento', 'contents': [{ 'kind': 'block', 'type': 'movimentar_player' }] },
            { 'kind': 'category', 'name': 'Controles', 'contents': [{ 'kind': 'block', 'type': 'ao_pressionar_botao' }] },
            { 'kind': 'category', 'name': 'Lógica', 'contents': [{ 'kind': 'block', 'type': 'math_number' }] }
        ]
    },
    theme: 'dark'
});

// 4. SISTEMA DE PUBLICAÇÃO (LOCALSTORAGE PARA O TESTE)
function publicarJogo() {
    let nome = prompt("Qual o nome do seu jogo?");
    if(!nome) return;
    
    let xml = Blockly.Xml.workspaceToDom(workspace);
    let xmlText = Blockly.Xml.domToText(xml);
    
    let jogos = JSON.parse(localStorage.getItem('meusJogos') || '[]');
    jogos.push({ nome: nome, data: xmlText });
    localStorage.setItem('meusJogos', JSON.stringify(jogos));
    
    atualizarGaleria();
}

function atualizarGaleria() {
    let galeria = document.getElementById('galeria');
    let jogos = JSON.parse(localStorage.getItem('meusJogos') || '[]');
    galeria.innerHTML = "";
    
    jogos.forEach((jogo, index) => {
        galeria.innerHTML += `
            <div class="game-card">
                <strong>${jogo.nome}</strong><br>
                <button onclick="carregarJogo(${index})">📂 Abrir</button>
            </div>`;
    });
}

function carregarJogo(index) {
    let jogos = JSON.parse(localStorage.getItem('meusJogos') || '[]');
    let xml = Blockly.utils.xml.textToDom(jogos[index].data);
    workspace.clear();
    Blockly.Xml.domToWorkspace(xml, workspace);
}

// 5. EXPORTAR PARA O ARDUINO
function exportarCodigo() {
    let code = cppGenerator.workspaceToCode(workspace);
    let template = `
#include <Wire.h>
#include <Adafruit_GFX.h>
#include <Adafruit_SSD1306.h>

Adafruit_SSD1306 display(128, 64, &Wire, -1);
int playerX = 64, playerY = 32;

void setup() {
  display.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  pinMode(2, INPUT_PULLUP); // Cima
  pinMode(3, INPUT_PULLUP); // Baixo
  pinMode(4, INPUT_PULLUP); // Esquerda
  pinMode(5, INPUT_PULLUP); // Direita
  pinMode(6, INPUT_PULLUP); // Botão A
}

void loop() {
  display.clearDisplay();
  
  // LOGICA DO USUARIO
  ${code}
  
  display.fillRect(playerX, playerY, 8, 8, WHITE);
  display.display();
  delay(10);
}`;
    document.getElementById('codigoC++').innerText = template;
}

atualizarGaleria();
</script>
</body>
</html>
