<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NanoBoy Engine v2 - Com Preview e Colisão</title>
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <style>
        :root { --bg: #1a1a1a; --panel: #252526; --accent: #00ff88; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; }
        
        .main { display: flex; flex: 1; }
        #blocklyDiv { flex: 2; border-right: 2px solid #000; }
        
        /* Estilo do GameBoy Preview */
        #preview-area { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; background: #333; }
        #screen-container { background: #99ad82; padding: 15px; border: 10px solid #555; border-radius: 10px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        canvas { background: #99ad82; image-rendering: pixelated; border: 2px solid #7a8a68; width: 256px; height: 128px; }
        
        .controls { display: grid; grid-template-columns: repeat(3, 40px); gap: 5px; margin-top: 20px; }
        .btn-ctrl { width: 40px; height: 40px; background: #444; border: none; color: white; border-radius: 5px; cursor: pointer; }
        .btn-ctrl:active { background: var(--accent); color: black; }

        .btn-action { padding: 10px 20px; background: var(--accent); border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 10px; }
        #codigo-box { width: 90%; height: 100px; background: #000; color: #0f0; font-family: monospace; font-size: 10px; margin-top: 10px; overflow: auto; padding: 10px; }
    </style>
</head>
<body>

<header>
    <h2>NanoBoy Engine 🕹️</h2>
    <button class="btn-action" onclick="publicarJogo()">PUBLICAR</button>
</header>

<div class="main">
    <div id="blocklyDiv"></div>

    <div id="preview-area">
        <h3>Preview</h3>
        <div id="screen-container">
            <canvas id="gameCanvas" width="128" height="64"></canvas>
        </div>
        
        <div class="controls">
            <div></div><button class="btn-ctrl" onmousedown="setKey('up',true)" onmouseup="setKey('up',false)">▲</button><div></div>
            <button class="btn-ctrl" onmousedown="setKey('left',true)" onmouseup="setKey('left',false)">◀</button>
            <button class="btn-ctrl" onmousedown="setKey('down',true)" onmouseup="setKey('down',false)">▼</button>
            <button class="btn-ctrl" onmousedown="setKey('right',true)" onmouseup="setKey('right',false)">▶</button>
        </div>

        <button class="btn-action" onclick="startPreview()" style="background: #ffcc00;">▶ RODAR PREVIEW</button>
        
        <div id="codigo-box">Clique em gerar código...</div>
        <button class="btn-action" onclick="gerarArduino()" style="background: #007bff; color: white;">GERAR CÓDIGO ARDUINO</button>
    </div>
</div>

<xml id="toolbox" style="display: none">
    <category name="Movimento" colour="230">
        <block type="mover_player"></block>
        <block type="set_pos"></block>
    </category>
    <category name="Colisão" colour="0">
        <block type="se_colidir"></block>
    </category>
    <category name="Gráficos" colour="160">
        <block type="desenhar_inimigo"></block>
        <block type="escrever_texto"></block>
    </category>
    <category name="Lógica" colour="210">
        <block type="controls_if"></block>
        <block type="logic_compare"></block>
        <block type="math_number"></block>
    </category>
</xml>

<script>
// --- CONFIGURAÇÃO DE BLOCOS ---
Blockly.defineBlocksWithJsonArray([
    {
        "type": "mover_player",
        "message0": "Mover Player: DX %1 DY %2",
        "args0": [{ "type": "input_value", "name": "DX" }, { "type": "input_value", "name": "DY" }],
        "previousStatement": null, "nextStatement": null, "colour": 230
    },
    {
        "type": "set_pos",
        "message0": "Colocar %1 em X: %2 Y: %3",
        "args0": [
            { "type": "field_dropdown", "name": "OBJ", "options": [["Inimigo", "enemy"], ["Moeda", "coin"]] },
            { "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }
        ],
        "previousStatement": null, "nextStatement": null, "colour": 230
    },
    {
        "type": "se_colidir",
        "message0": "Se Player tocar no %1",
        "args0": [{ "type": "field_dropdown", "name": "OBJ", "options": [["Inimigo", "enemy"], ["Moeda", "coin"]] }],
        "output": "Boolean", "colour": 0
    },
    {
        "type": "desenhar_inimigo",
        "message0": "Desenhar Inimigo",
        "previousStatement": null, "nextStatement": null, "colour": 160
    },
    {
        "type": "escrever_texto",
        "message0": "Escrever %1 em X: %2 Y: %3",
        "args0": [{ "type": "input_value", "name": "TXT" }, { "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }],
        "previousStatement": null, "nextStatement": null, "colour": 160
    }
]);

// --- ENGINE DO PREVIEW (JAVASCRIPT) ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let player = { x: 64, y: 32 };
let enemy = { x: 20, y: 20 };
let keys = { up: false, down: false, left: false, right: false };
let gameLoop;

function setKey(k, v) { keys[k] = v; }

function startPreview() {
    if(gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(() => {
        // Limpar tela (Verde GameBoy)
        ctx.fillStyle = "#99ad82";
        ctx.fillRect(0, 0, 128, 64);
        
        ctx.fillStyle = "#2d3325"; // Cor dos pixels acesos
        
        // Simular controles
        if(keys.up) player.y -= 1;
        if(keys.down) player.y += 1;
        if(keys.left) player.x -= 1;
        if(keys.right) player.x += 1;

        // Desenhar Player
        ctx.fillRect(player.x, player.y, 6, 6);

        // Aqui o interpretador executaria a lógica dos blocos... 
        // Para o teste, vamos desenhar o inimigo
        ctx.strokeRect(enemy.x, enemy.y, 6, 6);

        // Teste de colisão simples
        if(Math.abs(player.x - enemy.x) < 6 && Math.abs(player.y - enemy.y) < 6) {
            ctx.fillText("COLISÃO!", 40, 10);
        }
    }, 30);
}

// --- GERADOR DE ARDUINO ---
const workspace = Blockly.inject('blocklyDiv', { toolbox: document.getElementById('toolbox'), theme: 'dark' });

function gerarArduino() {
    // Definimos o gerador para Arduino (usando o JS como base para simplificar)
    const code = Blockly.JavaScript.workspaceToCode(workspace);
    const template = `
#include <Adafruit_SSD1306.h>
Adafruit_SSD1306 display(128, 64, &Wire, -1);
int px=64, py=32, ex=20, ey=20;

void setup() {
  display.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  pinMode(2, INPUT_PULLUP); // Cima
}

void loop() {
  display.clearDisplay();
  
  // Lógica dos Blocos:
  ${code.replace(/player\./g, 'p').replace(/enemy\./g, 'e')}

  if(digitalRead(2) == LOW) py--;

  display.fillRect(px, py, 6, 6, WHITE);
  display.drawRect(ex, ey, 6, 6, WHITE);
  display.display();
}`;
    document.getElementById('codigo-box').innerText = template;
}

// Lógica de tradução simplificada dos blocos
Blockly.JavaScript['mover_player'] = function(block) {
    var dx = Blockly.JavaScript.valueToCode(block, 'DX', 0) || '0';
    var dy = Blockly.JavaScript.valueToCode(block, 'DY', 0) || '0';
    return `player.x += ${dx}; player.y += ${dy};\n`;
};

Blockly.JavaScript['se_colidir'] = function(block) {
    return [`(Math.abs(player.x - enemy.x) < 6 && Math.abs(player.y - enemy.y) < 6)`, 0];
};

Blockly.JavaScript['math_number'] = function(block) { return [block.getFieldValue('NUM'), 0]; };
</script>
</body>
</html>
