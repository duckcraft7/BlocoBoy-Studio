<!DOCTYPE html>
<html lang="pt-pt">
<head>
  <meta charset="UTF-8">
  <title>NanoBoy OS Maker v15</title>
  
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed"></script>
  <script src="https://unpkg.com/blockly/msg/pt-br.js"></script>

  <style>
    :root { --main: #00ff88; --bg: #0a0a0a; --panel: #161616; }
    body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); }
    
    .main-container { display: flex; flex: 1; overflow: hidden; }
    
    /* Sidebar */
    #sidebar { width: 230px; background: #111; border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; }
    .project-item { padding: 12px; background: #1e1e1e; margin-bottom: 8px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; display: flex; justify-content: space-between; font-size: 13px; }
    .project-active { border-color: var(--main); background: #252525; color: var(--main); font-weight: bold; }

    /* Área Central */
    #editorContainer { flex: 1; display: flex; flex-direction: column; position: relative; }
    #tabIndicator { background: #222; padding: 5px 20px; font-size: 12px; color: var(--main); border-bottom: 1px solid #333; text-transform: uppercase; }
    #blocklyDiv { flex: 1; width: 100%; }
    
    /* Código */
    #codeSide { width: 380px; background: #111; border-left: 1px solid #333; padding: 15px; display: flex; flex-direction: column; }
    textarea { flex: 1; background: #000; color: #00ff88; font-family: 'Consolas', monospace; font-size: 11px; padding: 10px; border: 1px solid #333; border-radius: 4px; resize: none; outline: none; }
    
    .btn { background: var(--main); color: black; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 11px; }
    input { background: #000; color: white; border: 1px solid #333; padding: 8px; margin-bottom: 10px; width: 80%; border-radius: 4px; }
    .btn-del { background: #ff4757; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <span>🕹️</span>
    <h2 style="margin:0; font-size: 16px;">NanoBoy Multi-Engine</h2>
  </div>
  <div style="display:flex; gap:10px;">
    <button class="btn" style="background:#444; color:white;" onclick="baixarXML()">📥 Salvar XML</button>
    <button class="btn" onclick="gerarCodigoOS()">🚀 Gerar Código Final</button>
  </div>
</header>

<div class="main-container">
  <div id="sidebar">
    <h3 style="font-size:11px; color:#666;">JOGOS NO SISTEMA</h3>
    <input type="text" id="projName" placeholder="Nome do Jogo...">
    <button class="btn" onclick="novoProjeto()">+ Criar Novo Jogo</button>
    <div id="projectList" style="margin-top:20px;"></div>
  </div>

  <div id="editorContainer">
    <div id="tabIndicator">A editar: <span id="curName">Menu</span></div>
    <div id="blocklyDiv"></div>
  </div>

  <div id="codeSide">
    <h3 style="font-size:11px; color:#666;">C++ CONSOLIDADO</h3>
    <textarea id="outputCode" readonly></textarea>
  </div>
</div>

<xml id="toolbox" style="display: none">
  <category name="Sistema" colour="20">
    <block type="nano_set_state"></block>
    <block type="controls_if"></block>
    <block type="logic_compare"></block>
  </category>
  <category name="Variáveis" colour="330" custom="VARIABLE"></category>
  <category name="Hardware" colour="160">
    <block type="nano_draw_rect"></block>
    <block type="nano_draw_text"></block>
    <block type="nano_btn_pressed"></block>
    <block type="nano_clear"></block>
    <block type="math_number"></block>
    <block type="text"></block>
  </category>
</xml>

<script>
// --- MOTOR DE PROJETOS ---
let projetos = {
    "Menu": { xml: '<xml xmlns="https://developers.google.com/blockly/xml"></xml>', id: 0 }
};
let projetoAtivo = "Menu";

// --- BLOCOS ---
Blockly.defineBlocksWithJsonArray([
  { "type": "nano_set_state", "message0": "Ir para Jogo ID: %1", "args0": [{ "type": "input_value", "name": "ST" }], "previousStatement": null, "nextStatement": null, "colour": 20 },
  { "type": "nano_draw_rect", "message0": "Ret X:%1 Y:%2 L:%3 A:%4", "args0": [{ "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }, { "type": "input_value", "name": "W" }, { "type": "input_value", "name": "H" }], "previousStatement": null, "nextStatement": null, "colour": 160 },
  { "type": "nano_draw_text", "message0": "Texto %1 em X:%2 Y:%3", "args0": [{ "type": "input_value", "name": "TXT" }, { "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }], "previousStatement": null, "nextStatement": null, "colour": 160 },
  { "type": "nano_btn_pressed", "message0": "Botão %1?", "args0": [{ "type": "field_dropdown", "name": "P", "options": [["2", "2"], ["3", "3"], ["4", "4"]] }], "output": "Boolean", "colour": 160 },
  { "type": "nano_clear", "message0": "Limpar Tela", "previousStatement": null, "nextStatement": null, "colour": 160 }
]);

const gen = javascript.javascriptGenerator;
gen.init = function(w) { 
    gen.nameDB_ = new Blockly.Names(gen.variableDB_ ? gen.variableDB_.getNameType() : '');
    gen.nameDB_.setVariableMap(w.getVariableMap());
    gen.definitions_ = Object.create(null); 
};

gen.forBlock['variables_get'] = function(b) { return [workspace.getVariableById(b.getFieldValue('VAR')).name, 0]; };
gen.forBlock['variables_set'] = function(b, g) { return workspace.getVariableById(b.getFieldValue('VAR')).name + ' = ' + (g.valueToCode(b, 'VALUE', 0) || '0') + ';\n'; };
gen.forBlock['nano_set_state'] = function(b, g) { return "estado = " + (g.valueToCode(b, 'ST', 0) || '0') + ";\n"; };
gen.forBlock['nano_draw_rect'] = function(b, g) { return `d.fillRect(${g.valueToCode(b, 'X', 0) || 0}, ${g.valueToCode(b, 'Y', 0) || 0}, ${g.valueToCode(b, 'W', 0) || 4}, ${g.valueToCode(b, 'H', 0) || 4}, WHITE);\n`; };
gen.forBlock['nano_draw_text'] = function(b, g) { return `d.setCursor(${g.valueToCode(b, 'X', 0) || 0}, ${g.valueToCode(b, 'Y', 0) || 0}); d.print(${g.valueToCode(b, 'TXT', 0) || '""'});\n`; };
gen.forBlock['nano_btn_pressed'] = function(b) { return [`(digitalRead(${b.getFieldValue('P')}) == LOW)`, 0]; };
gen.forBlock['nano_clear'] = function() { return `d.clearDisplay();\n`; };
gen.forBlock['math_number'] = function(b) { return [b.getFieldValue('NUM'), 0]; };
gen.forBlock['text'] = function(b) { return ["\"" + b.getFieldValue('TEXT') + "\"", 0]; };

const workspace = Blockly.inject('blocklyDiv', { toolbox: document.getElementById('toolbox'), theme: 'dark' });

// --- LÓGICA DE TROCA DE ABA ---
function carregarProjeto(nome) {
    // 1. Salvar o XML do jogo que estamos a abandonar
    const dom = Blockly.Xml.workspaceToDom(workspace);
    projetos[projetoAtivo].xml = Blockly.Xml.domToText(dom);
    
    // 2. Trocar o nome ativo
    projetoAtivo = nome;
    document.getElementById('curName').innerText = nome;
    
    // 3. Limpar o ecrã e injetar o XML do novo jogo
    workspace.clear();
    const novoDom = Blockly.Xml.textToDom(projetos[nome].xml);
    Blockly.Xml.domToWorkspace(novoDom, workspace);
    
    renderList();
}

function novoProjeto() {
    const nome = document.getElementById('projName').value.trim();
    if(!nome || projetos[nome]) return alert("Nome inválido ou já existe!");
    
    // Cria o novo projeto na lista
    projetos[nome] = { 
        xml: '<xml xmlns="https://developers.google.com/blockly/xml"></xml>', 
        id: Object.keys(projetos).length 
    };
    
    document.getElementById('projName').value = "";
    carregarProjeto(nome); // Abre a aba nova automaticamente
}

function renderList() {
    const list = document.getElementById('projectList');
    list.innerHTML = "";
    Object.keys(projetos).forEach(nome => {
        const div = document.createElement('div');
        div.className = `project-item ${projetoAtivo === nome ? 'project-active' : ''}`;
        div.innerHTML = `<span>ID ${projetos[nome].id}: ${nome}</span>`;
        div.onclick = () => carregarProjeto(nome);
        list.appendChild(div);
    });
}

function gerarCodigoOS() {
    // Salva o projeto atual antes de gerar tudo
    const dom = Blockly.Xml.workspaceToDom(workspace);
    projetos[projetoAtivo].xml = Blockly.Xml.domToText(dom);

    let code = `// NanoBoy Modular OS\n#include <Adafruit_SSD1306.h>\n#include <Wire.h>\nAdafruit_SSD1306 d(128, 64, &Wire, -1);\nint estado = 0;\n`;
    let vars = new Set();
    let funcoes = "";

    Object.keys(projetos).forEach(nome => {
        const tWS = new Blockly.Workspace();
        Blockly.Xml.domToWorkspace(Blockly.Xml.textToDom(projetos[nome].xml), tWS);
        tWS.getAllVariables().forEach(v => vars.add(v.name));
        const c = gen.workspaceToCode(tWS).replace(/var /g, "");
        funcoes += `void rodar_${nome.replace(/\s/g,'_')}() {\n${c}\n}\n\n`;
        tWS.dispose();
    });

    vars.forEach(v => code += `int ${v} = 0;\n`);
    code += `\nvoid setup() {\n d.begin(SSD1306_SWITCHCAPVCC, 0x3C);\n d.setTextColor(WHITE);\n pinMode(2, INPUT_PULLUP);\n pinMode(3, INPUT_PULLUP);\n pinMode(4, INPUT_PULLUP);\n}\n\n${funcoes}`;
    code += `void loop() {\n d.clearDisplay();\n switch(estado) {\n`;
    Object.keys(projetos).forEach(n => code += `  case ${projetos[n].id}: rodar_${n.replace(/\s/g,'_')}(); break;\n`);
    code += ` }\n d.display();\n delay(20);\n}`;

    document.getElementById('outputCode').value = code;
}

function baixarXML() {
    const xml = Blockly.Xml.domToPrettyText(Blockly.Xml.workspaceToDom(workspace));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([xml], {type: "text/xml"}));
    a.download = `${projetoAtivo}.xml`;
    a.click();
}

renderList();
</script>
</body>
</html>
