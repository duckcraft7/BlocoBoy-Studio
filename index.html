<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NanoBoy Engine v3 - IA e Paredes</title>
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --accent: #ff4757; --green: #2ed573; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
        .main { display: flex; flex: 1; }
        #blocklyDiv { flex: 2; border-right: 2px solid #333; }
        #preview-area { flex: 1; padding: 20px; background: #252526; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        #screen-container { background: #8bac0f; padding: 10px; border: 8px solid #333; border-radius: 5px; }
        canvas { background: #8bac0f; image-rendering: pixelated; width: 256px; height: 128px; border: 2px solid #306230; }
        .controls { display: grid; grid-template-columns: repeat(3, 45px); gap: 5px; margin: 15px 0; }
        .btn-ctrl { width: 45px; height: 45px; background: #333; border: 1px solid #555; color: white; border-radius: 50%; cursor: pointer; }
        .btn-action { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #code-output { width: 100%; height: 120px; background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0; color: var(--green);">NanoBoy Engine v3 🕹️</h2>
    <button class="btn-action" style="width:auto; background: var(--green);" onclick="publicar()">Publicar Jogo</button>
</header>

<div class="main">
    <div id="blocklyDiv"></div>

    <div id="preview-area">
        <div id="screen-container">
            <canvas id="gameCanvas" width="128" height="64"></canvas>
        </div>

        <div class="controls">
            <div></div><button class="btn-ctrl" onmousedown="k('u',1)" onmouseup="k('u',0)">▲</button><div></div>
            <button class="btn-ctrl" onmousedown="k('l',1)" onmouseup="k('l',0)">◀</button>
            <button class="btn-ctrl" onmousedown="k('d',1)" onmouseup="k('d',0)">▼</button>
            <button class="btn-ctrl" onmousedown="k('r',1)" onmouseup="k('r',0)">▶</button>
        </div>

        <button class="btn-action" style="background: #ff9f43;" onclick="start()">▶ RODAR PREVIEW</button>
        <button class="btn-action" style="background: #54a0ff;" onclick="gerarArduino()">💾 GERAR CÓDIGO ARDUINO</button>
        <textarea id="code-output" readonly></textarea>
    </div>
</div>

<xml id="toolbox" style="display: none">
    <category name="Mundo" colour="160">
        <block type="criar_parede"></block>
        <block type="escrever_texto"></block>
    </category>
    <category name="Personagens" colour="230">
        <block type="mover_player"></block>
        <block type="ia_inimigo"></block>
        <block type="matar_player"></block>
    </category>
    <category name="Lógica" colour="210">
        <block type="controls_if"></block>
        <block type="logic_compare"></block>
        <block type="se_colidir"></block>
        <block type="math_number"></block>
    </category>
</xml>

<script>
// --- 1. DEFINIÇÃO DOS NOVOS BLOCOS ---
Blockly.defineBlocksWithJsonArray([
    {
        "type": "criar_parede",
        "message0": "Criar Parede X: %1 Y: %2 L: %3 A: %4",
        "args0": [{"type":"input_value","name":"X"},{"type":"input_value","name":"Y"},{"type":"input_value","name":"W"},{"type":"input_value","name":"H"}],
        "previousStatement": null, "nextStatement": null, "colour": 160
    },
    {
        "type": "matar_player",
        "message0": "MATAR PLAYER (Reiniciar)",
        "previousStatement": null, "nextStatement": null, "colour": 0
    },
    {
        "type": "ia_inimigo",
        "message0": "IA: Inimigo segue Player vel: %1",
        "args0": [{"type":"input_value","name":"VEL"}],
        "previousStatement": null, "nextStatement": null, "colour": 290
    },
    { "type": "mover_player", "message0": "Mover Player DX: %1 DY: %2", "args0": [{"type":"input_value","name":"DX"},{"type":"input_value","name":"DY"}], "previousStatement": null, "nextStatement": null, "colour": 230 },
    { "type": "escrever_texto", "message0": "Texto: %1 em X:%2 Y:%3", "args0": [{"type":"input_value","name":"T"},{"type":"input_value","name":"X"},{"type":"input_value","name":"Y"}], "previousStatement": null, "nextStatement": null, "colour": 160 },
    { "type": "se_colidir", "message0": "Player toca no Inimigo?", "output": "Boolean", "colour": 210 }
]);

// --- 2. ENGINE DO PREVIEW ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let px=64, py=32, ex=10, ey=10;
let walls = [];
let keys = {u:0, d:0, l:0, r:0};
let loop;

function k(key, val) { keys[key] = val; }

function checkWall(nx, ny) {
    return walls.some(w => nx < w.x + w.w && nx + 4 > w.x && ny < w.y + w.h && ny + 4 > w.y);
}

function start() {
    if(loop) clearInterval(loop);
    px=64; py=32; ex=10; ey=10;
    
    loop = setInterval(() => {
        // Limpar
        ctx.fillStyle = "#8bac0f";
        ctx.fillRect(0,0,128,64);
        ctx.fillStyle = "#0f380f";

        // Resetar paredes a cada frame para os blocos reconstruírem
        walls = [];
        
        // Executar código dos blocos no Preview (Interpretador Simples)
        const code = Blockly.JavaScript.workspaceToCode(workspace);
        try { eval(code); } catch(e) {}

        // Movimento com colisão de parede
        let nextX = px, nextY = py;
        if(keys.u) nextY--; if(keys.d) nextY++;
        if(keys.l) nextX--; if(keys.r) nextX++;
        
        if(!checkWall(nextX, py)) px = nextX;
        if(!checkWall(px, nextY)) py = nextY;

        // Desenhar Player e Inimigo
        ctx.fillRect(px, py, 4, 4); 
        ctx.strokeRect(ex, ey, 5, 5); 
    }, 50);
}

// --- 3. GERADORES DE CÓDIGO ---
const workspace = Blockly.inject('blocklyDiv', {toolbox:document.getElementById('toolbox'), theme:'dark'});

// Tradução para o Preview (JS)
Blockly.JavaScript['criar_parede'] = function(block) {
    const x = Blockly.JavaScript.valueToCode(block, 'X', 0);
    const y = Blockly.JavaScript.valueToCode(block, 'Y', 0);
    const w = Blockly.JavaScript.valueToCode(block, 'W', 0);
    const h = Blockly.JavaScript.valueToCode(block, 'H', 0);
    return `walls.push({x:${x}, y:${y}, w:${w}, h:${h}}); ctx.fillRect(${x},${y},${w},${h});\n`;
};

Blockly.JavaScript['ia_inimigo'] = function(block) {
    const v = Blockly.JavaScript.valueToCode(block, 'VEL', 0) || '0.5';
    return `if(ex < px) ex+=${v}; if(ex > px) ex-=${v}; if(ey < py) ey+=${v}; if(ey > py) ey-=${v};\n`;
};

Blockly.JavaScript['matar_player'] = function(block) {
    return `if(Math.abs(px-ex)<5 && Math.abs(py-ey)<5) { px=64; py=32; }\n`;
};

// Funções auxiliares de matemática para o gerador
Blockly.JavaScript['math_number'] = function(block) { return [block.getFieldValue('NUM'), 0]; };
Blockly.JavaScript['mover_player'] = function(block) { 
    return `px += ${Blockly.JavaScript.valueToCode(block, 'DX', 0)}; py += ${Blockly.JavaScript.valueToCode(block, 'DY', 0)};\n`; 
};

function gerarArduino() {
    const code = Blockly.JavaScript.workspaceToCode(workspace);
    const cleanCode = code.replace(/ctx\..*;/g, '').replace(/walls\.push.*;/g, ''); // Limpa comandos de canvas
    
    document.getElementById('code-output').value = `
#include <Adafruit_SSD1306.h>
Adafruit_SSD1306 d(128, 64, &Wire, -1);
float px=64, py=32, ex=10, ey=10;

void setup() {
  d.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  pinMode(2, INPUT_PULLUP); // Exemplo de pino
}

void loop() {
  d.clearDisplay();
  // --- LÓGICA DOS BLOCOS ---
  ${cleanCode}
  // -----------------------
  d.fillRect(px, py, 4, 4, WHITE);
  d.drawRect(ex, ey, 5, 5, WHITE);
  d.display();
  delay(30);
}`;
}
</script>
</body>
</html>
