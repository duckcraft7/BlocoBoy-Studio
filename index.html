<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>NanoBoy Engine v9 - Sound Update</title>
  
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed"></script>
  <script src="https://unpkg.com/blockly/msg/pt-br.js"></script>

  <style>
    :root { --main: #00ff88; --bg: #121212; --panel: #1e1e1e; --sound: #ff4757; }
    body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: var(--panel); padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); }
    .container { display: flex; flex: 1; overflow: hidden; }
    #blocklyDiv { flex: 3; }
    #codeSide { flex: 1.2; background: #181818; padding: 20px; display: flex; flex-direction: column; border-left: 2px solid #333; }
    textarea { flex: 1; background: #000; color: #00ff88; font-family: 'Consolas', monospace; font-size: 12px; padding: 15px; border: 1px solid #444; border-radius: 4px; resize: none; outline: none; }
    .btn-group { display: flex; gap: 10px; }
    .btn { background: var(--main); color: black; border: none; padding: 10px 18px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 12px; transition: 0.3s; }
    .btn-sec { background: #444; color: white; }
    h3 { margin: 0 0 10px 0; font-size: 13px; color: var(--main); text-transform: uppercase; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <span style="font-size: 28px;">🎶</span>
    <h2 style="margin:0; font-size: 20px;">NanoBoy Sound Engine</h2>
  </div>
  <div class="btn-group">
    <button class="btn btn-sec" onclick="salvarProjeto()">💾 Salvar</button>
    <button class="btn btn-sec" onclick="abrirProjeto()">📂 Abrir</button>
    <button class="btn" onclick="exportarCodigo()">🚀 Gerar Código</button>
  </div>
</header>

<div class="container">
  <div id="blocklyDiv"></div>
  <div id="codeSide">
    <h3>📄 CÓDIGO C++ COM ÁUDIO</h3>
    <textarea id="outputCode" readonly></textarea>
  </div>
</div>

<xml id="toolbox" style="display: none">
  <category name="Lógica" colour="210">
    <block type="controls_if"></block>
    <block type="logic_compare"></block>
    <block type="logic_operation"></block>
  </category>
  <category name="Variáveis" colour="330" custom="VARIABLE"></category>
  <category name="Matemática" colour="230">
    <block type="math_number"></block>
    <block type="math_arithmetic"></block>
    <block type="math_random_int"></block>
  </category>
  <category name="Texto" colour="160">
    <block type="text"></block>
  </category>
  <sep></sep>
  <category name="👾 NanoBoy" colour="160">
    <block type="nano_draw_rect"></block>
    <block type="nano_draw_text"></block>
    <block type="nano_btn_pressed"></block>
    <block type="nano_clear"></block>
  </category>
  <category name="🔊 Som" colour="345">
    <block type="nano_play_note"></block>
    <block type="nano_beep"></block>
  </category>
</xml>

<script>
// --- 1. DEFINIÇÃO DOS BLOCOS DE SOM ---
Blockly.defineBlocksWithJsonArray([
  { "type": "nano_play_note", "message0": "Tocar Nota Freq: %1 Duração: %2 ms", "args0": [{ "type": "input_value", "name": "FREQ" }, { "type": "input_value", "name": "DUR" }], "previousStatement": null, "nextStatement": null, "colour": 345 },
  { "type": "nano_beep", "message0": "Fazer Beep %1", "args0": [{ "type": "field_dropdown", "name": "TYPE", "options": [["Pulo", "600"], ["Explosão", "150"], ["Tiro", "800"], ["Moeda", "1200"]] }], "previousStatement": null, "nextStatement": null, "colour": 345 },
  // Reaproveitando os blocos anteriores
  { "type": "nano_draw_rect", "message0": "Desenhar Retângulo X: %1 Y: %2 L: %3 A: %4", "args0": [{ "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }, { "type": "input_value", "name": "W" }, { "type": "input_value", "name": "H" }], "previousStatement": null, "nextStatement": null, "colour": 160 },
  { "type": "nano_draw_text", "message0": "Escrever %1 em X: %2 Y: %3", "args0": [{ "type": "input_value", "name": "TXT" }, { "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }], "previousStatement": null, "nextStatement": null, "colour": 160 },
  { "type": "nano_btn_pressed", "message0": "Botão %1 pressionado?", "args0": [{ "type": "field_dropdown", "name": "PIN", "options": [["Pulo (D2)", "2"], ["Esq (D3)", "3"], ["Dir (D4)", "4"]] }], "output": "Boolean", "colour": 160 },
  { "type": "nano_clear", "message0": "Limpar Tela", "previousStatement": null, "nextStatement": null, "colour": 160 }
]);

// --- 2. GERADORES DE C++ ---
const gen = javascript.javascriptGenerator;

gen.forBlock['nano_play_note'] = function(block, g) {
  return `tone(5, ${g.valueToCode(block, 'FREQ', 0) || 440}, ${g.valueToCode(block, 'DUR', 0) || 100});\n`;
};

gen.forBlock['nano_beep'] = function(block) {
  return `tone(5, ${block.getFieldValue('TYPE')}, 50);\n`;
};

// (Mantendo os geradores de variáveis e hardware corrigidos da v8)
gen.forBlock['variables_get'] = function(block) { return [workspace.getVariableById(block.getFieldValue('VAR')).name, 0]; };
gen.forBlock['variables_set'] = function(block, g) { return workspace.getVariableById(block.getFieldValue('VAR')).name + ' = ' + (g.valueToCode(block, 'VALUE', 0) || '0') + ';\n'; };
gen.forBlock['math_random_int'] = function(block, g) { return [`random(${g.valueToCode(block, 'FROM', 0) || '0'}, ${g.valueToCode(block, 'TO', 0) || '100'} + 1)`, 0]; };
gen.forBlock['text'] = function(block) { return ["\"" + block.getFieldValue('TEXT') + "\"", 0]; };
gen.forBlock['nano_draw_rect'] = function(block, g) { return `d.fillRect(${g.valueToCode(block, 'X', 0) || 0}, ${g.valueToCode(block, 'Y', 0) || 0}, ${g.valueToCode(block, 'W', 0) || 4}, ${g.valueToCode(block, 'H', 0) || 4}, WHITE);\n`; };
gen.forBlock['nano_draw_text'] = function(block, g) { return `d.setCursor(${g.valueToCode(block, 'X', 0) || 0}, ${g.valueToCode(block, 'Y', 0) || 0}); d.print(${g.valueToCode(block, 'TXT', 0) || '""'});\n`; };
gen.forBlock['nano_btn_pressed'] = function(block) { return [`(digitalRead(${block.getFieldValue('PIN')}) == LOW)`, 0]; };
gen.forBlock['nano_clear'] = function() { return `d.clearDisplay();\n`; };

// --- 3. INICIALIZAÇÃO ---
const workspace = Blockly.inject('blocklyDiv', { toolbox: document.getElementById('toolbox'), theme: 'dark' });

function exportarCodigo() {
  const vars = workspace.getAllVariables();
  let vDecl = vars.map(v => `int ${v.name} = 0;`).join('\n');
  const code = gen.workspaceToCode(workspace);
  
  document.getElementById('outputCode').value = `// NanoBoy v9 - Audio Enabled
#include <Adafruit_SSD1306.h>
#include <Wire.h>

Adafruit_SSD1306 d(128, 64, &Wire, -1);

${vDecl}

void setup() {
  d.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  d.setTextColor(WHITE);
  pinMode(2, INPUT_PULLUP);
  pinMode(3, INPUT_PULLUP);
  pinMode(4, INPUT_PULLUP);
  pinMode(5, OUTPUT); // PINO DO BUZZER
}

void loop() {
  d.clearDisplay();
  ${code}
  d.display();
  delay(20);
}`;
}

// --- 4. FUNÇÕES DE SAVE/LOAD ---
function salvarProjeto() {
  const xml = Blockly.Xml.workspaceToDom(workspace);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([Blockly.Xml.domToPrettyText(xml)], {type: "text/xml"}));
  a.download = "projeto_nanoboy.xml";
  a.click();
}

function abrirProjeto() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = e => {
    const reader = new FileReader();
    reader.onload = ev => {
      workspace.clear();
      Blockly.Xml.domToWorkspace(Blockly.utils.xml.textToDom(ev.target.result), workspace);
    };
    reader.readAsText(e.target.files[0]);
  };
  input.click();
}
</script>
</body>
</html>
