<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NanoBoy ESP32 - Pro Engine</title>
    <style>
        :root { --accent: #e67e22; --bg: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #2c3e50; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); }
        .main { display: flex; flex: 1; overflow: hidden; }
        
        /* Estilo dos nossos blocos customizados */
        #palette { width: 280px; background: #252526; padding: 15px; border-right: 2px solid #000; overflow-y: auto; }
        .block { padding: 10px; margin-bottom: 8px; border-radius: 4px; cursor: grab; font-weight: bold; border-left: 5px solid rgba(0,0,0,0.3); }
        .b-event { background: #eb4d4b; } 
        .b-ia { background: #686de0; }
        .b-world { background: #6ab04c; }
        .b-math { background: #f0932b; }

        #workspace { flex: 1; background: #1e1e1e; padding: 20px; position: relative; overflow-y: auto; outline: none; }
        #preview { width: 350px; background: #2d3436; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        canvas { background: #95afc0; border: 6px solid #333; width: 256px; height: 128px; image-rendering: pixelated; }
        textarea { width: 100%; height: 200px; background: #000; color: #00ff00; font-family: monospace; font-size: 11px; margin-top: 15px; padding: 10px; border: 1px solid var(--accent); }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0">NanoBoy ESP32 🚀</h2>
    <button class="btn" style="background:var(--accent)" onclick="gerarArduino()">GERAR CÓDIGO WOKWI</button>
</header>

<div class="main">
    <div id="palette">
        <h3>Lógica de Jogo</h3>
        <div class="block b-event" draggable="true" data-type="gravity">🍎 Física: Gravidade (Flappy)</div>
        <div class="block b-ia" draggable="true" data-type="ia_follow">🧠 IA: Inimigo Persegue</div>
        <div class="block b-ia" draggable="true" data-type="kill">💀 Se Tocar: Matar Player</div>
        <div class="block b-world" draggable="true" data-type="wall">🧱 Criar Parede Sólida</div>
        <div class="block b-world" draggable="true" data-type="grid">🏁 Ativar Grade (Tetris)</div>
        <div class="block b-math" draggable="true" data-type="jump">⬆️ Botão: Pular/Subir</div>
    </div>

    <div id="workspace" ondragover="event.preventDefault()" ondrop="drop(event)">
        <p style="color:#666">Arraste os blocos para cá...</p>
    </div>

    <div id="preview">
        <canvas id="gameScreen" width="128" height="64"></canvas>
        <div style="margin-top:10px">
            <button class="btn" style="background:#2ecc71" onclick="testar()">TESTAR PREVIEW</button>
        </div>
        <textarea id="code-output" readonly></textarea>
    </div>
</div>

<script>
    let px = 60, py = 30, pv = 0;
    let ex = 10, ey = 10;
    let gameLoop;

    function drop(e) {
        e.preventDefault();
        const type = e.dataTransfer.getData("type");
        const block = document.createElement("div");
        block.className = "block " + e.srcElement.className;
        block.innerHTML = e.dataTransfer.getData("text") + " <span onclick='this.parentElement.remove()' style='float:right; cursor:pointer'>❌</span>";
        block.dataset.type = type;
        document.getElementById("workspace").appendChild(block);
    }

    document.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData("type", e.target.dataset.type);
        e.dataTransfer.setData("text", e.target.innerText);
    });

    function testar() {
        const ctx = document.getElementById('gameScreen').getContext('2d');
        const blocks = Array.from(document.getElementById('workspace').querySelectorAll('.block')).map(b => b.dataset.type);
        
        if(gameLoop) clearInterval(gameLoop);
        px = 60; py = 30; pv = 0; ex = 10; ey = 10;

        gameLoop = setInterval(() => {
            ctx.fillStyle = "#95afc0";
            ctx.fillRect(0,0,128,64);
            ctx.fillStyle = "#2d3436";

            blocks.forEach(type => {
                if(type === 'gravity') { pv += 0.3; py += pv; }
                if(type === 'ia_follow') { 
                    if(ex < px) ex += 0.5; else ex -= 0.5;
                    if(ey < py) ey += 0.5; else ey -= 0.5;
                }
                if(type === 'kill') {
                    if(Math.abs(px-ex) < 5 && Math.abs(py-ey) < 5) { px = 60; py = 30; }
                }
            });

            if(py > 58) { py = 58; pv = 0; }
            ctx.fillRect(px, py, 6, 6); // Player
            ctx.strokeRect(ex, ey, 6, 6); // Inimigo
        }, 30);
    }

    function gerarArduino() {
        const blocks = Array.from(document.getElementById('workspace').querySelectorAll('.block')).map(b => b.dataset.type);
        let logic = "";
        
        blocks.forEach(t => {
            if(t === 'gravity') logic += "  vel += 0.2; py += vel;\n";
            if(t === 'ia_follow') logic += "  if(ex < px) ex += 0.3; else ex -= 0.3;\n  if(ey < py) ey += 0.3; else ey -= 0.3;\n";
            if(t === 'kill') logic += "  if(abs(px-ex)<5 && abs(py-ey)<5) { px=60; py=30; }\n";
            if(t === 'jump') logic += "  if(digitalRead(26) == LOW) vel = -2;\n";
        });

        const code = `
#include <Adafruit_SSD1306.h>
#define SDA 21
#define SCL 22

Adafruit_SSD1306 d(128, 64, &Wire, -1);
float px=60, py=30, vel=0;
float ex=10, ey=10;

void setup() {
  Wire.begin(SDA, SCL);
  d.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  pinMode(26, INPUT_PULLUP); // Botão A
}

void loop() {
  d.clearDisplay();
  
  ${logic}

  d.fillRect(px, py, 6, 6, WHITE); // Player
  d.drawRect(ex, ey, 6, 6, WHITE); // Inimigo
  d.display();
  delay(20);
}`;
        document.getElementById('code-output').value = code;
    }
</script>
</body>
</html>
