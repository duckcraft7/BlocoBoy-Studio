<!DOCTYPE html>
<html>
<head>

<title>Arduino Game Maker</title>
<script src="https://unpkg.com/blockly/blockly.min.js"></script>

<style>

body{
font-family:Arial;
margin:0;
display:flex;
height:100vh;
}

#games{
width:200px;
background:#222;
color:white;
padding:10px;
}

#blocklyDiv{
flex:1;
height:100%;
}

button{
width:100%;
margin-top:5px;
}

</style>

</head>

<body>

<div id="games">

<h3>Jogos</h3>

<div id="lista"></div>

<button onclick="novoJogo()">Novo jogo</button>
<button onclick="novoLevel()">Novo level</button>
<button onclick="gerar()">Gerar código</button>

</div>

<div id="blocklyDiv"></div>

<xml id="toolbox" style="display:none">

<category name="Jogo">
<block type="controls_if"></block>
<block type="controls_repeat_ext"></block>
</category>

<category name="Matemática">
<block type="math_number"></block>
</category>

</xml>

<script>

var workspace = Blockly.inject('blocklyDiv',{
toolbox: document.getElementById('toolbox')
});

let jogos=[];
let atual=null;

function novoJogo(){

let nome=prompt("Nome do jogo");

jogos.push({
nome:nome,
levels:[]
});

atual=jogos.length-1;

update();

}

function novoLevel(){

if(atual==null)return;

let nome=prompt("Nome do level");

jogos[atual].levels.push(nome);

update();

}

function update(){

let div=document.getElementById("lista");

div.innerHTML="";

jogos.forEach((g,i)=>{

let e=document.createElement("div");

e.innerText=g.nome;

e.onclick=()=>{atual=i};

div.appendChild(e);

});

}

function gerar(){

let codigo="";

jogos.forEach((g,i)=>{

g.levels.forEach((l,j)=>{

codigo+="void "+g.nome+"_"+l+"(){}\n";

});

});

alert(codigo);

}

</script>

</body>

</html>
