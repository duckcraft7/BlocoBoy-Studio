<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NanoBoy Lite - Ultra Low RAM</title>
    <style>
        :root { --nano-blue: #00979d; --bg: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #333; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--nano-blue); }
        
        .main { display: flex; flex: 1; overflow: hidden; }
        #palette { width: 250px; background: #252526; padding: 15px; border-right: 1px solid #000; }
        #workspace { flex: 1; background: #1e1e1e; padding: 20px; position: relative; overflow-y: auto; border: 2px dashed #333; }
        
        /* Blocos Ultra-Simples */
        .block { padding: 8px; margin-bottom: 5px; border-radius: 3px; cursor: grab; font-size: 12px; font-weight: bold; color: #000; }
        .b-event { background: #ff5e57; } 
        .b-phys { background: #575fcf; color: #fff; }
        .b-game { background: #0be881; }

        #preview-box { width: 320px; background: #2d2d2d; padding: 15px; border-left: 1px solid #000; display: flex; flex-direction: column; }
        canvas { background: #000; width: 100%; image-rendering: pixelated; border: 2px solid #555; }
        textarea { width: 100%; flex: 1; background: #000; color: #0f0; font-family: monospace; font-size: 10px; padding: 10px; margin-top: 10px; border: 1px solid var(--nano-blue); }
        .btn { padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; background: var(--nano-blue); color: white; }
    </style>
</head>
<body>

<header>
    <h3 style="margin:0">NanoBoy Lite (RAM Optimizer) 🕹️</h3>
    <button class="btn" onclick="gerarCodigo()">GERAR C++ LEVE</button>
</header>

<div class="main">
    <div id="palette">
        <div class="block b-event" draggable="true" data-type="start">🚀 Ao Iniciar</div>
        <div class="block b-phys" draggable="true" data-type="grav">📉 Gravidade (Byte)</div>
        <div class="block b-phys" draggable="true" data-type="jump">⬆️ Pulo Simples</div>
        <div class="block b-game" draggable="true" data-type="pipe">🚧 Cano (Econômico)</div>
        <div class="block b-game" draggable="true" data-type="grid">🏁 Grade 8x16 (Tetris)</div>
    </div>

    <div id="workspace" ondragover="event.preventDefault()" ondrop="drop(event)">
        <p style="color:#444">Arraste blocos para economizar memória...</p>
    </div>

    <div id="preview-box">
        <canvas id="screen" width="128" height="64"></canvas>
        <textarea id="code-output" readonly placeholder="Código otimizado para Nano..."></textarea>
    </div>
</div>

<script>
    function drop(e) {
        e.preventDefault();
        const type = e.dataTransfer.getData("type");
        const block = document.createElement("div");
        block.className = "block " + e.srcElement.className;
        block.innerHTML = e.dataTransfer.getData("text") + " <span onclick='this.parentElement.remove()' style='float:right'>×</span>";
        block.dataset.type = type;
        document.getElementById("workspace").appendChild(block);
    }

    document.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData("type", e.target.dataset.type);
        e.dataTransfer.setData("text", e.target.innerText);
    });

    function gerarCodigo() {
        const blocks = Array.from(document.getElementById('workspace').querySelectorAll('.block')).map(b => b.dataset.type);
        
        // Variáveis usando uint8_t (8 bits) em vez de int (16 bits) para economizar RAM
        let setupCode = "";
        let loopCode = "";

        blocks.forEach(t => {
            if(t === 'grav') loopCode += "  if(f % 2 == 0) y++; // Gravidade lenta\n";
            if(t === 'jump') loopCode += "  if(digitalRead(2)==LOW) y-=3;\n";
            if(t === 'pipe') loopCode += "  px--; if(px<0) { px=127; ph=random(10,30); }\n";
            if(t === 'grid') setupCode += "  // Tetris Grid: 128 bytes\n  uint8_t grid[16][8];\n";
        });

        const template = `
// NANOBOY LITE - CÓDIGO ULTRA LEVE
#include <Wire.h>
#include <Adafruit_GFX.h>
#include <Adafruit_SSD1306.h>

Adafruit_SSD1306 d(128, 64, &Wire, -1);

// Tipos minúsculos para economizar RAM
uint8_t y=30, px=127, ph=20, f=0; 

void setup() {
  d.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  pinMode(2, INPUT_PULLUP);
  ${setupCode}
}

void loop() {
  d.clearDisplay();
  f++; 
  
  ${loopCode}

  d.fillRect(20, y, 4, 4, WHITE);   // Player
  d.fillRect(px, 0, 8, ph, WHITE);  // Cano
  
  d.display();
  // Delay curto para manter fluidez com pouco processamento
  delay(15); 
}`;
        document.getElementById('code-output').value = template;
    }
</script>
</body>
</html>
