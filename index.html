<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>NanoBoy Maker v13 - Tabs Fixed</title>
  
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed"></script>
  <script src="https://unpkg.com/blockly/msg/pt-br.js"></script>

  <style>
    :root { --main: #00ff88; --bg: #121212; --panel: #1e1e1e; }
    body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); }
    .main-container { display: flex; flex: 1; overflow: hidden; }
    
    /* Sidebar */
    #sidebar { width: 240px; background: #181818; border-right: 2px solid #333; display: flex; flex-direction: column; padding: 15px; }
    .project-item { padding: 12px; background: #252526; margin-bottom: 8px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; transition: 0.2s; border: 1px solid transparent; }
    .project-item:hover { background: #333; border-color: #444; }
    .project-active { border-color: var(--main); background: #2d2d2d; box-shadow: inset 4px 0 0 var(--main); }

    #blocklyDiv { flex: 1; }
    #codeSide { width: 380px; background: #181818; padding: 20px; display: flex; flex-direction: column; border-left: 2px solid #333; }
    textarea { flex: 1; background: #000; color: var(--main); font-family: 'Consolas', monospace; font-size: 11px; padding: 15px; border: 1px solid #444; border-radius: 4px; resize: none; line-height: 1.5; }
    
    .btn { background: var(--main); color: black; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 12px; }
    .btn-del { background: #ff4757; color: white; padding: 4px 8px; font-size: 10px; border-radius: 3px; }
    input { background: #000; color: white; border: 1px solid #444; padding: 8px; margin-bottom: 10px; border-radius: 4px; width: 85%; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <span style="font-size: 24px;">📟</span>
    <h2 style="margin:0; font-size: 18px;">NanoBoy Multi-Project</h2>
  </div>
  <div style="display:flex; gap:10px;">
    <button class="btn" style="background:#444; color:white;" onclick="baixarTudo()">📥 Baixar ZIP</button>
    <button class="btn" onclick="gerarCodigoOS()">🚀 Gerar Código Final</button>
  </div>
</header>

<div class="main-container">
  <div id="sidebar">
    <h3 style="font-size:14px; color:var(--main)">MEUS JOGOS</h3>
    <input type="text" id="projName" placeholder="Nome do novo jogo...">
    <button class="btn" onclick="novoProjeto()">+ Criar Novo</button>
    <hr style="width:100%; border:0; border-top:1px solid #333; margin:15px 0;">
    <div id="projectList"></div>
  </div>

  <div id="blocklyDiv"></div>

  <div id="codeSide">
    <h3>📄 CÓDIGO MULTI-GAME</h3>
    <textarea id="outputCode" readonly placeholder="O código consolidado aparecerá aqui..."></textarea>
  </div>
</div>

<xml id="toolbox" style="display: none">
  <category name="Sistema" colour="20">
    <block type="controls_if"></block>
    <block type="logic_compare"></block>
    <block type="nano_set_state"></block>
    <block type="nano_get_state"></block>
  </category>
  <category name="Variáveis" colour="330" custom="VARIABLE"></category>
  <category name="Matemática" colour="230">
    <block type="math_number"></block>
    <block type="math_arithmetic"></block>
    <block type="math_random_int"></block>
  </category>
  <category name="Texto" colour="160"><block type="text"></block></category>
  <sep></sep>
  <category name="👾 Gráficos" colour="160">
    <block type="nano_draw_rect"></block>
    <block type="nano_draw_text"></block>
    <block type="nano_clear"></block>
  </category>
  <category name="🎮 Controles" colour="160">
    <block type="nano_btn_pressed"></block>
  </category>
</xml>

<script>
// --- BANCO DE DADOS LOCAL ---
let projetos = JSON.parse(localStorage.getItem('nanoboy_v13_save')) || {
    "Menu": { xml: '<xml xmlns="https://developers.google.com/blockly/xml"></xml>', id: 0 }
};
let projetoAtivo = localStorage.getItem('nanoboy_v13_last') || "Menu";

// --- CONFIGURAÇÃO BLOCOS ---
Blockly.defineBlocksWithJsonArray([
  { "type": "nano_set_state", "message0": "Mudar para Jogo ID: %1", "args0": [{ "type": "input_value", "name": "ST" }], "previousStatement": null, "nextStatement": null, "colour": 20 },
  { "type": "nano_get_state", "message0": "ID deste Jogo", "output": "Number", "colour": 20 },
  { "type": "nano_draw_rect", "message0": "Retângulo X:%1 Y:%2 L:%3 A:%4", "args0": [{ "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }, { "type": "input_value", "name": "W" }, { "type": "input_value", "name": "H" }], "previousStatement": null, "nextStatement": null, "colour": 160 },
  { "type": "nano_draw_text", "message0": "Escrever %1 em X:%2 Y:%3", "args0": [{ "type": "input_value", "name": "TXT" }, { "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }], "previousStatement": null, "nextStatement": null, "colour": 160 },
  { "type": "nano_btn_pressed", "message0": "Botão %1?", "args0": [{ "type": "field_dropdown", "name": "P", "options": [["Ação (2)", "2"], ["Esq (3)", "3"], ["Dir (4)", "4"]] }], "output": "Boolean", "colour": 160 },
  { "type": "nano_clear", "message0": "Limpar Tela", "previousStatement": null, "nextStatement": null, "colour": 160 }
]);

const generator = javascript.javascriptGenerator;
generator.init = function(w) { 
    generator.nameDB_ = new Blockly.Names(generator.variableDB_ ? generator.variableDB_.getNameType() : '');
    generator.nameDB_.setVariableMap(w.getVariableMap());
    generator.definitions_ = Object.create(null); 
};

// Tradutores (C++ puro)
generator.forBlock['variables_get'] = function(block) { return [workspace.getVariableById(block.getFieldValue('VAR')).name, 0]; };
generator.forBlock['variables_set'] = function(block, gen) { return workspace.getVariableById(block.getFieldValue('VAR')).name + ' = ' + (gen.valueToCode(block, 'VALUE', 0) || '0') + ';\n'; };
generator.forBlock['nano_set_state'] = function(block, gen) { return "estado = " + (gen.valueToCode(block, 'ST', 0) || '0') + ";\n"; };
generator.forBlock['nano_get_state'] = function() { return ["estado", 0]; };
generator.forBlock['nano_draw_rect'] = function(block, gen) { return `d.fillRect(${gen.valueToCode(block, 'X', 0) || 0}, ${gen.valueToCode(block, 'Y', 0) || 0}, ${gen.valueToCode(block, 'W', 0) || 4}, ${gen.valueToCode(block, 'H', 0) || 4}, WHITE);\n`; };
generator.forBlock['nano_draw_text'] = function(block, gen) { return `d.setCursor(${gen.valueToCode(block, 'X', 0) || 0}, ${gen.valueToCode(block, 'Y', 0) || 0}); d.print(${gen.valueToCode(block, 'TXT', 0) || '""'});\n`; };
generator.forBlock['nano_btn_pressed'] = function(block) { return [`(digitalRead(${block.getFieldValue('P')}) == LOW)`, 0]; };
generator.forBlock['nano_clear'] = function() { return `d.clearDisplay();\n`; };
generator.forBlock['math_number'] = function(block) { return [block.getFieldValue('NUM'), 0]; };
generator.forBlock['text'] = function(block) { return ["\"" + block.getFieldValue('TEXT') + "\"", 0]; };
generator.forBlock['math_random_int'] = function(block, gen) { return [`random(${gen.valueToCode(block, 'FROM', 0) || 0}, ${gen.valueToCode(block, 'TO', 0) || 100} + 1)`, 0]; };

const workspace = Blockly.inject('blocklyDiv', { toolbox: document.getElementById('toolbox'), theme: 'dark' });

// --- GESTÃO DE PROJETOS ---
function renderList() {
    const list = document.getElementById('projectList');
    list.innerHTML = "";
    Object.keys(projetos).forEach(nome => {
        const div = document.createElement('div');
        div.className = `project-item ${projetoAtivo === nome ? 'project-active' : ''}`;
        div.innerHTML = `<span><strong>ID ${projetos[nome].id}</strong>: ${nome}</span>`;
        div.onclick = () => carregarProjeto(nome);
        
        const btnDel = document.createElement('button');
        btnDel.className = "btn-del";
        btnDel.innerText = "X";
        btnDel.onclick = (e) => { e.stopPropagation(); deletarProjeto(nome); };
        
        div.appendChild(btnDel);
        list.appendChild(div);
    });
}

function salvarEstadoAtual() {
    if (projetoAtivo && projetos[projetoAtivo]) {
        const xml = Blockly.Xml.workspaceToDom(workspace);
        projetos[projetoAtivo].xml = Blockly.Xml.domToText(xml);
        localStorage.setItem('nanoboy_v13_save', JSON.stringify(projetos));
        localStorage.setItem('nanoboy_v13_last', projetoAtivo);
    }
}

function carregarProjeto(nome) {
    salvarEstadoAtual(); // Salva o que estava aberto antes
    projetoAtivo = nome;
    workspace.clear();
    const xml = Blockly.Xml.textToDom(projetos[nome].xml);
    Blockly.Xml.domToWorkspace(xml, workspace);
    renderList();
}

function novoProjeto() {
    const nome = document.getElementById('projName').value.trim();
    if (!nome || projetos[nome]) return alert("Nome inválido ou já existe!");
    
    salvarEstadoAtual();
    projetos[nome] = { 
        xml: '<xml xmlns="https://developers.google.com/blockly/xml"></xml>', 
        id: Object.keys(projetos).length 
    };
    projetoAtivo = nome;
    workspace.clear();
    document.getElementById('projName').value = "";
    renderList();
    salvarEstadoAtual();
}

function deletarProjeto(nome) {
    if (Object.keys(projetos).length <= 1) return alert("Você precisa de pelo menos um projeto!");
    if (confirm(`Deletar o jogo "${nome}"?`)) {
        delete projetos[nome];
        projetoAtivo = Object.keys(projetos)[0];
        carregarProjeto(projetoAtivo);
    }
}

function gerarCodigoOS() {
    salvarEstadoAtual();
    let code = `// NanoBoy OS v13\n#include <Adafruit_SSD1306.h>\n#include <Wire.h>\n\nAdafruit_SSD1306 d(128, 64, &Wire, -1);\nint estado = 0;\n`;
    
    let varsGlobais = new Set();
    let funcoes = "";

    // Simula a exportação de cada projeto para pegar as variáveis
    Object.keys(projetos).forEach(nome => {
        const tempWS = new Blockly.Workspace();
        Blockly.Xml.domToWorkspace(Blockly.Xml.textToDom(projetos[nome].xml), tempWS);
        tempWS.getAllVariables().forEach(v => varsGlobais.add(v.name));
        
        const blocoCod = generator.workspaceToCode(tempWS).replace(/var /g, "");
        funcoes += `void rodar_${nome.replace(/\s/g, '_')}() {\n${blocoCod}\n}\n\n`;
        tempWS.dispose();
    });

    varsGlobais.forEach(v => code += `int ${v} = 0;\n`);
    code += `\nvoid setup() {\n  d.begin(SSD1306_SWITCHCAPVCC, 0x3C);\n  d.setTextColor(WHITE);\n  pinMode(2, INPUT_PULLUP);\n  pinMode(3, INPUT_PULLUP);\n  pinMode(4, INPUT_PULLUP);\n}\n\n${funcoes}`;
    
    code += `void loop() {\n  d.clearDisplay();\n  switch(estado) {\n`;
    Object.keys(projetos).forEach(nome => {
        code += `    case ${projetos[nome].id}: rodar_${nome.replace(/\s/g, '_')}(); break;\n`;
    });
    code += `  }\n  d.display();\n  delay(20);\n}`;

    document.getElementById('outputCode').value = code;
}

// Inicializar carregando o último projeto aberto
carregarProjeto(projetoAtivo);
</script>
</body>
</html>
