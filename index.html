<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>NanoBoy Maker v11 - Menu System</title>
  
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed"></script>
  <script src="https://unpkg.com/blockly/msg/pt-br.js"></script>

  <style>
    :root { --main: #00ff88; --bg: #121212; --panel: #1e1e1e; }
    body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: var(--panel); padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); }
    .container { display: flex; flex: 1; overflow: hidden; }
    #blocklyDiv { flex: 3; }
    #codeSide { flex: 1.3; background: #181818; padding: 20px; display: flex; flex-direction: column; border-left: 2px solid #333; }
    textarea { flex: 1; background: #000; color: #00ff88; font-family: 'Consolas', monospace; font-size: 11px; padding: 15px; border: 1px solid #444; border-radius: 4px; resize: none; outline: none; line-height: 1.5; }
    .btn-group { display: flex; gap: 10px; }
    .btn { background: var(--main); color: black; border: none; padding: 10px 18px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 12px; transition: 0.3s; }
    .btn:hover { background: #00cc6e; transform: scale(1.02); }
    h3 { margin: 0 0 10px 0; font-size: 13px; color: var(--main); text-transform: uppercase; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <span style="font-size: 28px;">📑</span>
    <h2 style="margin:0; font-size: 18px;">NanoBoy Multi-Game</h2>
  </div>
  <div class="btn-group">
    <button class="btn" style="background:#444; color:white;" onclick="salvarProjeto()">💾 Salvar</button>
    <button class="btn" style="background:#444; color:white;" onclick="abrirProjeto()">📂 Abrir</button>
    <button class="btn" onclick="exportarCodigo()">🚀 Gerar Código C++</button>
  </div>
</header>

<div class="container">
  <div id="blocklyDiv"></div>
  <div id="codeSide">
    <h3>📄 CÓDIGO MULTI-JOGO</h3>
    <textarea id="outputCode" readonly></textarea>
  </div>
</div>

<xml id="toolbox" style="display: none">
  <category name="Sistema/Menu" colour="20">
    <block type="controls_if"></block>
    <block type="logic_compare"></block>
    <block type="nano_set_state"></block>
    <block type="nano_get_state"></block>
  </category>
  <category name="Variáveis" colour="330" custom="VARIABLE"></category>
  <category name="Matemática" colour="230">
    <block type="math_number"></block>
    <block type="math_arithmetic"></block>
    <block type="math_random_int"></block>
  </category>
  <category name="Texto" colour="160"><block type="text"></block></category>
  <sep></sep>
  <category name="👾 Gráficos" colour="160">
    <block type="nano_draw_rect"></block>
    <block type="nano_draw_text"></block>
    <block type="nano_clear"></block>
  </category>
  <category name="🎮 Controles" colour="160">
    <block type="nano_btn_pressed"></block>
  </category>
</xml>

<script>
// --- 1. BLOCOS DE SISTEMA ---
Blockly.defineBlocksWithJsonArray([
  { "type": "nano_set_state", "message0": "Mudar para o Jogo: %1", "args0": [{ "type": "input_value", "name": "STATE" }], "previousStatement": null, "nextStatement": null, "colour": 20 },
  { "type": "nano_get_state", "message0": "ID do Jogo Atual", "output": "Number", "colour": 20 },
  { "type": "nano_draw_rect", "message0": "Desenhar Retângulo X: %1 Y: %2 L: %3 A: %4", "args0": [{ "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }, { "type": "input_value", "name": "W" }, { "type": "input_value", "name": "H" }], "previousStatement": null, "nextStatement": null, "colour": 160 },
  { "type": "nano_draw_text", "message0": "Escrever %1 em X: %2 Y: %3", "args0": [{ "type": "input_value", "name": "TXT" }, { "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }], "previousStatement": null, "nextStatement": null, "colour": 160 },
  { "type": "nano_btn_pressed", "message0": "Botão %1 pressionado?", "args0": [{ "type": "field_dropdown", "name": "PIN", "options": [["Ação (D2)", "2"], ["Esq (D3)", "3"], ["Dir (D4)", "4"]] }], "output": "Boolean", "colour": 160 },
  { "type": "nano_clear", "message0": "Limpar Tela", "previousStatement": null, "nextStatement": null, "colour": 160 }
]);

const generator = javascript.javascriptGenerator;

// --- 2. TRADUTORES (FIXED) ---
generator.init = function(workspace) {
  generator.nameDB_ = new Blockly.Names(generator.variableDB_ ? generator.variableDB_.getNameType() : '');
  generator.nameDB_.setVariableMap(workspace.getVariableMap());
  generator.definitions_ = Object.create(null);
};

generator.forBlock['nano_set_state'] = function(block, gen) {
  return "estado = " + (gen.valueToCode(block, 'STATE', 0) || '0') + ";\n";
};

generator.forBlock['nano_get_state'] = function() { return ["estado", 0]; };
generator.forBlock['variables_get'] = function(block) { return [workspace.getVariableById(block.getFieldValue('VAR')).name, 0]; };
generator.forBlock['variables_set'] = function(block, gen) { return workspace.getVariableById(block.getFieldValue('VAR')).name + ' = ' + (gen.valueToCode(block, 'VALUE', 0) || '0') + ';\n'; };
generator.forBlock['math_number'] = function(block) { return [block.getFieldValue('NUM'), 0]; };
generator.forBlock['math_arithmetic'] = function(block, gen) {
    const ops = { 'ADD': '+', 'MINUS': '-', 'MULTIPLY': '*', 'DIVIDE': '/' };
    const op = ops[block.getFieldValue('OP')];
    const a = gen.valueToCode(block, 'A', 0) || '0';
    const b = gen.valueToCode(block, 'B', 0) || '0';
    return [`(${a} ${op} ${b})`, 0];
};
generator.forBlock['nano_draw_rect'] = function(block, gen) { return `d.fillRect(${gen.valueToCode(block, 'X', 0) || 0}, ${gen.valueToCode(block, 'Y', 0) || 0}, ${gen.valueToCode(block, 'W', 0) || 4}, ${gen.valueToCode(block, 'H', 0) || 4}, WHITE);\n`; };
generator.forBlock['nano_draw_text'] = function(block, gen) { return `d.setCursor(${gen.valueToCode(block, 'X', 0) || 0}, ${gen.valueToCode(block, 'Y', 0) || 0}); d.print(${gen.valueToCode(block, 'TXT', 0) || '""'});\n`; };
generator.forBlock['nano_btn_pressed'] = function(block) { return [`(digitalRead(${block.getFieldValue('PIN')}) == LOW)`, 0]; };
generator.forBlock['nano_clear'] = function() { return `d.clearDisplay();\n`; };
generator.forBlock['text'] = function(block) { return ["\"" + block.getFieldValue('TEXT') + "\"", 0]; };

// --- 3. EXPORTAÇÃO ---
const workspace = Blockly.inject('blocklyDiv', { toolbox: document.getElementById('toolbox'), theme: 'dark' });

function exportarCodigo() {
  const vars = workspace.getAllVariables();
  let vDecl = vars.map(v => `int ${v.name} = 0;`).join('\n');
  let rawCode = generator.workspaceToCode(workspace).replace(/var /g, "");

  document.getElementById('outputCode').value = `// NanoBoy v11 - Multi-Game System
#include <Adafruit_SSD1306.h>
#include <Wire.h>

Adafruit_SSD1306 d(128, 64, &Wire, -1);

// ESTADO DO SISTEMA (0 = MENU, 1+ = JOGOS)
int estado = 0;

// VARIÁVEIS GLOBAIS
${vDecl}

void setup() {
  d.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  d.setTextColor(WHITE);
  pinMode(2, INPUT_PULLUP);
  pinMode(3, INPUT_PULLUP);
  pinMode(4, INPUT_PULLUP);
}

void loop() {
  d.clearDisplay();
  
  ${rawCode}

  d.display();
  delay(20);
}
`;
}

// --- SAVE/LOAD ---
function salvarProjeto() {
  const xml = Blockly.Xml.workspaceToDom(workspace);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([Blockly.Xml.domToPrettyText(xml)], {type: "text/xml"}));
  a.download = "multigame_nanoboy.xml";
  a.click();
}

function abrirProjeto() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = e => {
    const reader = new FileReader();
    reader.onload = ev => {
      workspace.clear();
      Blockly.Xml.domToWorkspace(Blockly.utils.xml.textToDom(ev.target.result), workspace);
    };
    reader.readAsText(e.target.files[0]);
  };
  input.click();
}
</script>
</body>
</html>
