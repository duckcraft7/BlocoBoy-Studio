<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>NanoBoy Engine v8 - Gerador Pro</title>
  
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed"></script>
  <script src="https://unpkg.com/blockly/msg/pt-br.js"></script>

  <style>
    :root { --main: #00ff88; --bg: #121212; --panel: #1e1e1e; }
    body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: var(--panel); padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    
    .container { display: flex; flex: 1; overflow: hidden; }
    #blocklyDiv { flex: 3; }
    
    #codeSide { flex: 1.2; background: #181818; padding: 20px; display: flex; flex-direction: column; border-left: 2px solid #333; }
    textarea { flex: 1; background: #000; color: #00ff88; font-family: 'Consolas', monospace; font-size: 12px; padding: 15px; border: 1px solid #444; border-radius: 4px; resize: none; outline: none; line-height: 1.4; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn { background: var(--main); color: black; border: none; padding: 10px 18px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 12px; transition: 0.3s; text-transform: uppercase; }
    .btn:hover { background: #00cc6e; transform: scale(1.02); }
    .btn-sec { background: #444; color: white; }
    h3 { margin: 0 0 10px 0; font-size: 13px; color: var(--main); letter-spacing: 1px; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <span style="font-size: 28px;">🕹️</span>
    <h2 style="margin:0; font-size: 20px; letter-spacing: 1px;">NanoBoy Engine</h2>
  </div>
  <div class="btn-group">
    <button class="btn btn-sec" onclick="salvarProjeto()">💾 Salvar</button>
    <button class="btn btn-sec" onclick="abrirProjeto()">📂 Abrir</button>
    <button class="btn" onclick="exportarCodigo()">🚀 Gerar Código C++</button>
  </div>
</header>

<div class="container">
  <div id="blocklyDiv"></div>
  <div id="codeSide">
    <h3>📄 CÓDIGO ARDUINO (PRONTO PARA O WOKWI)</h3>
    <textarea id="outputCode" readonly placeholder="Monte sua lógica e clique em Gerar..."></textarea>
  </div>
</div>

<xml id="toolbox" style="display: none">
  <category name="Lógica" colour="210">
    <block type="controls_if"></block>
    <block type="logic_compare"></block>
    <block type="logic_operation"></block>
    <block type="logic_boolean"></block>
  </category>
  <category name="Loops" colour="120">
    <block type="controls_repeat_ext"></block>
    <block type="controls_whileUntil"></block>
  </category>
  <category name="Variáveis" colour="330" custom="VARIABLE"></category>
  <category name="Matemática" colour="230">
    <block type="math_number"></block>
    <block type="math_arithmetic"></block>
  </category>
  <category name="Texto" colour="160">
    <block type="text"></block>
  </category>
  <sep></sep>
  <category name="👾 NanoBoy" colour="160">
    <block type="nano_draw_rect"></block>
    <block type="nano_draw_text"></block>
    <block type="nano_btn_pressed"></block>
    <block type="nano_clear"></block>
  </category>
</xml>

<script>
// --- 1. DEFINIÇÃO DOS BLOCOS ---
Blockly.defineBlocksWithJsonArray([
  { "type": "nano_draw_rect", "message0": "Desenhar Retângulo X: %1 Y: %2 L: %3 A: %4", "args0": [{ "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }, { "type": "input_value", "name": "W" }, { "type": "input_value", "name": "H" }], "previousStatement": null, "nextStatement": null, "colour": 160 },
  { "type": "nano_draw_text", "message0": "Escrever %1 em X: %2 Y: %3", "args0": [{ "type": "input_value", "name": "TXT" }, { "type": "input_value", "name": "X" }, { "type": "input_value", "name": "Y" }], "previousStatement": null, "nextStatement": null, "colour": 160 },
  { "type": "nano_btn_pressed", "message0": "Botão %1 pressionado?", "args0": [{ "type": "field_dropdown", "name": "PIN", "options": [["Pulo (D2)", "2"], ["Esq (D3)", "3"], ["Dir (D4)", "4"]] }], "output": "Boolean", "colour": 160 },
  { "type": "nano_clear", "message0": "Limpar Tela", "previousStatement": null, "nextStatement": null, "colour": 160 }
]);

// --- 2. CONFIGURAÇÃO DO GERADOR (TRADUTOR C++ LIMPO) ---
const generator = javascript.javascriptGenerator;

// Desativa a declaração automática de variáveis do Blockly (evita o 'var')
generator.init = function(workspace) {
  generator.nameDB_ = new Blockly.Names(generator.variableDB_ ? generator.variableDB_.getNameType() : '');
  generator.nameDB_.setVariableMap(workspace.getVariableMap());
};

// Tradutor de busca de variável: retorna apenas o nome puro
generator.forBlock['variables_get'] = function(block) {
  const varId = block.getFieldValue('VAR');
  const varName = workspace.getVariableById(varId).name;
  return [varName, 0];
};

// Tradutor de definição de variável: retorna "nome = valor;"
generator.forBlock['variables_set'] = function(block, gen) {
  const varId = block.getFieldValue('VAR');
  const varName = workspace.getVariableById(varId).name;
  const val = gen.valueToCode(block, 'VALUE', 0) || '0';
  return varName + ' = ' + val + ';\n';
};

// Tradutor de Texto
generator.forBlock['text'] = function(block) {
  return ["\"" + block.getFieldValue('TEXT') + "\"", 0];
};

// Blocos de Hardware
generator.forBlock['nano_draw_rect'] = function(block, gen) {
  const x = gen.valueToCode(block, 'X', 0) || '0';
  const y = gen.valueToCode(block, 'Y', 0) || '0';
  const w = gen.valueToCode(block, 'W', 0) || '4';
  const h = gen.valueToCode(block, 'H', 0) || '4';
  return `d.fillRect(${x}, ${y}, ${w}, ${h}, WHITE);\n`;
};

generator.forBlock['nano_draw_text'] = function(block, gen) {
  const txt = gen.valueToCode(block, 'TXT', 0) || '""';
  const x = gen.valueToCode(block, 'X', 0) || '0';
  const y = gen.valueToCode(block, 'Y', 0) || '0';
  return `d.setCursor(${x}, ${y}); d.print(${txt});\n`;
};

generator.forBlock['nano_btn_pressed'] = function(block) {
  return [`(digitalRead(${block.getFieldValue('PIN')}) == LOW)`, 0];
};

generator.forBlock['nano_clear'] = function() {
  return `d.clearDisplay();\n`;
};

// --- 3. INICIALIZAÇÃO ---
const workspace = Blockly.inject('blocklyDiv', {
  toolbox: document.getElementById('toolbox'),
  theme: 'dark',
  grid: { spacing: 20, length: 3, colour: '#333', snap: true }
});

// --- 4. FUNÇÃO DE EXPORTAÇÃO ---
function exportarCodigo() {
  // Pega as variáveis e cria as declarações globais no topo
  const vars = workspace.getAllVariables();
  let declaracoes = vars.map(v => `int ${v.name} = 0;`).join('\n');
  
  // Gera a lógica interna dos blocos
  let blockCode = generator.workspaceToCode(workspace);
  
  const template = `// Gerado por NanoBoy Engine v8
#include <Adafruit_SSD1306.h>
#include <Wire.h>

Adafruit_SSD1306 d(128, 64, &Wire, -1);

// --- VARIÁVEIS GLOBAIS ---
${declaracoes}

void setup() {
  d.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  d.setTextColor(WHITE);
  d.setTextSize(1);
  pinMode(2, INPUT_PULLUP);
  pinMode(3, INPUT_PULLUP);
  pinMode(4, INPUT_PULLUP);
}

void loop() {
  d.clearDisplay();
  
  // --- LÓGICA DO JOGO ---
${blockCode}
  // ----------------------

  d.display();
  delay(20);
}`;
  
  document.getElementById('outputCode').value = template;
}

// --- 5. SAVE / LOAD ---
function salvarProjeto() {
  const xml = Blockly.Xml.workspaceToDom(workspace);
  const blob = new Blob([Blockly.Xml.domToPrettyText(xml)], {type: "text/xml"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "jogo_nanoboy.xml";
  a.click();
}

function abrirProjeto() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = e => {
    const reader = new FileReader();
    reader.onload = ev => {
      workspace.clear();
      Blockly.Xml.domToWorkspace(Blockly.utils.xml.textToDom(ev.target.result), workspace);
    };
    reader.readAsText(e.target.files[0]);
  };
  input.click();
}
</script>
</body>
</html>
