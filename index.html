<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NanoBoy Custom Engine</title>
    <style>
        :root { --gb-green: #8bac0f; --gb-dark: #0f380f; --ui-bg: #1a1a1a; }
        body { font-family: 'Courier New', monospace; background: var(--ui-bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        header { background: #333; padding: 15px; display: flex; justify-content: space-between; border-bottom: 3px solid var(--gb-dark); }
        
        .container { display: flex; flex: 1; overflow: hidden; }
        
        /* Paleta de Blocos */
        #palette { width: 250px; background: #252526; padding: 10px; border-right: 2px solid #000; display: flex; flex-direction: column; gap: 10px; }
        
        /* Área de Script */
        #script-area { flex: 1; background: #1e1e1e; padding: 20px; overflow-y: auto; position: relative; }
        .block { 
            padding: 12px; border-radius: 5px; cursor: grab; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; gap: 8px; border: 2px solid rgba(0,0,0,0.2);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3); margin-bottom: 5px;
        }
        .block-event { background: #ff4757; } /* Vermelho: Gatilhos */
        .block-move { background: #54a0ff; }  /* Azul: Movimento */
        .block-logic { background: #2ed573; } /* Verde: Lógica/Tetris */
        .block-math { background: #ffa502; }  /* Laranja: Valores */

        /* Preview Area */
        #preview { width: 350px; background: #2d2d2d; padding: 20px; border-left: 2px solid #000; display: flex; flex-direction: column; align-items: center; }
        canvas { background: var(--gb-green); border: 8px solid #555; width: 256px; height: 128px; image-rendering: pixelated; }
        
        .drop-zone { border: 2px dashed #444; min-height: 100px; padding: 10px; border-radius: 8px; }
        textarea { width: 100%; height: 150px; background: #000; color: #0f0; border: none; font-size: 10px; margin-top: 10px; padding: 10px; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0">NANOBOY SCRIPT PRO 🚀</h2>
    <button onclick="exportarArduino()" style="background:var(--gb-green); border:none; padding:8px 15px; cursor:pointer; font-weight:bold">GERAR .INO</button>
</header>

<div class="container">
    <div id="palette">
        <h3>Blocos</h3>
        <div class="block block-event" draggable="true" data-type="loop">🔄 Sempre (Loop)</div>
        <div class="block block-event" draggable="true" data-type="btn_a">🔘 Se Apertar Botão A</div>
        <div class="block block-move" draggable="true" data-type="gravity">🍎 Aplicar Gravidade</div>
        <div class="block block-move" draggable="true" data-type="jump">🦘 Impulso (Pulo)</div>
        <div class="block block-logic" draggable="true" data-type="grid">🧱 Criar Grade Tetris</div>
        <div class="block block-logic" draggable="true" data-type="move_grid">↔️ Mover na Grade</div>
        <div class="block block-math" draggable="true" data-type="score">🏆 Ganhar +1 Ponto</div>
    </div>

    <div id="script-area">
        <h3>Script do Jogo</h3>
        <div id="workspace" class="drop-zone">
            </div>
    </div>

    <div id="preview">
        <canvas id="screen" width="128" height="64"></canvas>
        <div style="margin-top:10px; display:flex; gap:5px">
            <button onclick="runGame()">▶ TESTAR</button>
            <button onclick="document.getElementById('workspace').innerHTML=''">🗑 LIMPAR</button>
        </div>
        <textarea id="code-box" readonly placeholder="Código C++ para Arduino Nano..."></textarea>
    </div>
</div>

<script>
    const workspace = document.getElementById('workspace');
    let gameActive = false;
    let py = 30, pv = 0; // Física do Player
    let score = 0;

    // --- SISTEMA DE DRAG AND DROP ---
    document.addEventListener('dragstart', (e) => {
        if(e.target.classList.contains('block')) {
            e.dataTransfer.setData('type', e.target.dataset.type);
            e.dataTransfer.setData('html', e.target.outerHTML);
        }
    });

    workspace.addEventListener('dragover', (e) => e.preventDefault());

    workspace.addEventListener('drop', (e) => {
        e.preventDefault();
        const type = e.dataTransfer.getData('type');
        const html = e.dataTransfer.getData('html');
        
        const newBlock = document.createElement('div');
        newBlock.innerHTML = html;
        const el = newBlock.firstChild;
        el.style.cursor = 'default';
        
        // Adicionar botão de remover
        const del = document.createElement('span');
        del.innerHTML = ' [x]';
        del.style.color = 'black';
        del.style.cursor = 'pointer';
        del.onclick = () => el.remove();
        el.appendChild(del);
        
        workspace.appendChild(el);
    });

    // --- MOTOR DO JOGO (PREVIEW) ---
    function runGame() {
        gameActive = true;
        const ctx = document.getElementById('screen').getContext('2d');
        const blocks = Array.from(workspace.children).map(b => b.dataset.type);
        
        py = 30; pv = 0; score = 0;

        function loop() {
            if(!gameActive) return;
            ctx.fillStyle = "#8bac0f";
            ctx.fillRect(0,0,128,64);
            ctx.fillStyle = "#0f380f";

            // Processar Lógica de Blocos
            blocks.forEach(type => {
                if(type === 'gravity') {
                    pv += 0.2; // Gravidade
                    py += pv;
                }
                if(type === 'grid') {
                    // Desenha mini grade de Tetris no fundo
                    for(let i=0; i<128; i+=8) ctx.strokeRect(i,0,1,64);
                }
            });

            // Chão (Morte)
            if(py > 60) { py = 60; pv = 0; }

            ctx.fillRect(40, py, 6, 6); // O Player
            ctx.fillText("SCORE: " + score, 5, 10);

            requestAnimationFrame(loop);
        }
        loop();
    }

    // --- TRADUTOR PARA ARDUINO NANO ---
    function exportarArduino() {
        const blocks = Array.from(workspace.children).map(b => b.dataset.type);
        let loopCode = "";
        
        blocks.forEach(type => {
            switch(type) {
                case 'gravity': loopCode += "  v += 0.5; y += v;\n"; break;
                case 'jump': loopCode += "  if(digitalRead(2)==LOW) v = -3;\n"; break;
                case 'score': loopCode += "  ponto++;\n"; break;
                case 'grid': loopCode += "  desenharGrade();\n"; break;
            }
        });

        const fullCode = `
#include <Adafruit_SSD1306.h>
Adafruit_SSD1306 d(128, 64, &Wire, -1);
float y=30, v=0;
int ponto=0;

void setup() {
  d.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  pinMode(2, INPUT_PULLUP); // Botão de Pulo
}

void loop() {
  d.clearDisplay();
  ${loopCode}
  d.fillRect(40, (int)y, 6, 6, WHITE);
  d.display();
  delay(30);
}`;
        document.getElementById('code-box').value = fullCode;
    }
</script>
</body>
</html>
