<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NanoBoy Universal Engine</title>
    <style>
        :root { --primary: #00ff88; --bg: #121212; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e1e1e; padding: 10px 20px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--primary); }
        .main { display: flex; flex: 1; overflow: hidden; }
        
        /* Paleta de Blocos Genéricos */
        #palette { width: 260px; background: #181818; padding: 15px; border-right: 1px solid #333; overflow-y: auto; }
        .category { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .category h4 { color: var(--primary); margin: 5px 0; font-size: 12px; }
        
        .block { padding: 8px; margin-bottom: 5px; border-radius: 4px; cursor: grab; font-size: 11px; color: #000; font-weight: bold; }
        .b-event { background: #ff4757; }   /* Gatilhos: Quando... */
        .b-action { background: #54a0ff; }  /* Ações: Mova, Desenhe... */
        .b-logic { background: #ffa502; }   /* Lógica: Se, Enquanto... */
        .b-var { background: #2ed573; }     /* Variáveis: Vida, Pontos... */

        #workspace { flex: 1; background: #1e1e1e; padding: 25px; overflow-y: auto; }
        .workspace-block { display: flex; align-items: center; background: #333; margin-bottom: 4px; padding: 8px; border-radius: 4px; border-left: 5px solid; }

        #output { width: 400px; background: #181818; border-left: 1px solid #333; padding: 15px; display: flex; flex-direction: column; }
        canvas { background: #000; width: 100%; height: 160px; border: 4px solid #333; image-rendering: pixelated; }
        textarea { width: 100%; flex: 1; background: #000; color: #0f0; border: none; font-size: 11px; padding: 10px; margin-top: 10px; }
        .btn { padding: 10px; border: none; background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0">NanoBoy Universal 🛠️</h2>
    <button class="btn" onclick="gerarCodigo()">GERAR C++ DO JOGO</button>
</header>

<div class="main">
    <div id="palette">
        <div class="category">
            <h4>EVENTOS</h4>
            <div class="block b-event" draggable="true" data-type="on_tick">⏰ A cada frame</div>
            <div class="block b-event" draggable="true" data-type="on_btn">🔘 Se apertar botão</div>
        </div>
        <div class="category">
            <h4>MOVIMENTO</h4>
            <div class="block b-action" draggable="true" data-type="move_x">➡️ Mover em X</div>
            <div class="block b-action" draggable="true" data-type="move_y">⬇️ Mover em Y</div>
            <div class="block b-action" draggable="true" data-type="set_pos">📍 Teletransportar</div>
        </div>
        <div class="category">
            <h4>LÓGICA/FÍSICA</h4>
            <div class="block b-logic" draggable="true" data-type="if_col">💥 Se colidir com...</div>
            <div class="block b-logic" draggable="true" data-type="if_out">🧱 Se sair da tela</div>
            <div class="block b-logic" draggable="true" data-type="game_over">💀 Game Over</div>
        </div>
        <div class="category">
            <h4>VARIÁVEIS</h4>
            <div class="block b-var" draggable="true" data-type="add_score">🏆 Somar Ponto</div>
            <div class="block b-var" draggable="true" data-type="set_val">⚙️ Definir valor</div>
        </div>
    </div>

    <div id="workspace" ondragover="event.preventDefault()" ondrop="drop(event)">
        </div>

    <div id="output">
        <canvas id="preview" width="128" height="64"></canvas>
        <div style="margin-top:10px; display:flex; gap:5px">
            <button class="btn" onclick="runSim()">TESTAR</button>
            <button class="btn" style="background:#444; color:white" onclick="location.reload()">LIMPAR</button>
        </div>
        <textarea id="code-box" readonly placeholder="Código Arduino Nano..."></textarea>
    </div>
</div>

<script>
    function drop(e) {
        e.preventDefault();
        const type = e.dataTransfer.getData("type");
        const block = document.createElement("div");
        block.className = "workspace-block";
        block.style.borderLeftColor = window.getComputedStyle(document.querySelector(`[data-type="${type}"]`)).backgroundColor;
        block.innerHTML = `<span>${e.dataTransfer.getData("text")}</span> <input type="number" value="1" style="width:40px; margin:0 10px"> <button onclick="this.parentElement.remove()">×</button>`;
        block.dataset.type = type;
        document.getElementById("workspace").appendChild(block);
    }

    document.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData("type", e.target.dataset.type);
        e.dataTransfer.setData("text", e.target.innerText);
    });

    // --- GERADOR DE C++ GENÉRICO ---
    function gerarCodigo() {
        const blocks = Array.from(document.getElementById('workspace').querySelectorAll('.workspace-block'));
        let logic = "";
        
        blocks.forEach(b => {
            const val = b.querySelector('input').value;
            const t = b.dataset.type;
            if(t === 'move_x') logic += `  px += ${val};\n`;
            if(t === 'move_y') logic += `  py += ${val};\n`;
            if(t === 'on_btn') logic += `  if(digitalRead(2)==LOW) py -= ${val*3};\n`;
            if(t === 'add_score') logic += `  score += ${val};\n`;
            if(t === 'if_out') logic += `  if(py > 64 || py < 0) state = 1;\n`;
        });

        const code = `
#include <Adafruit_SSD1306.h>
Adafruit_SSD1306 d(128, 64, &Wire, -1);

int px=20, py=30, score=0;
uint8_t state=0; // 0=Play, 1=GameOver

void setup() {
  d.begin(SSD1306_SWITCHCAPVCC, 0x3C);
  pinMode(2, INPUT_PULLUP);
}

void loop() {
  d.clearDisplay();
  if(state == 0) {
    // Lógica Universal:
    ${logic}
    d.fillRect(px, py, 4, 4, WHITE);
  } else {
    d.setCursor(30, 30); d.print("GAME OVER");
    if(digitalRead(2)==LOW) { state=0; py=30; score=0; }
  }
  d.display();
  delay(20);
}`;
        document.getElementById('code-box').value = code;
    }
</script>
</body>
</html>
