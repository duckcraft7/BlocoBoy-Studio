<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Arduino Game Studio</title>

<script src="https://unpkg.com/blockly/blockly.min.js"></script>

<style>

body{
font-family:Arial;
background:#0f0f0f;
color:white;
margin:0;
}

header{
background:#1f1f1f;
padding:10px;
display:flex;
gap:10px;
align-items:center;
}

#gameList{
width:220px;
background:#181818;
height:calc(100vh - 50px);
overflow:auto;
padding:10px;
}

#editor{
flex:1;
display:flex;
flex-direction:column;
}

#blocklyDiv{
flex:1;
background:white;
}

#codigo{
height:200px;
background:#000;
color:#0f0;
overflow:auto;
padding:10px;
}

.container{
display:flex;
}

button{
padding:8px;
cursor:pointer;
}

.gameItem{
background:#333;
padding:8px;
margin:5px 0;
cursor:pointer;
}

</style>
</head>

<body>

<header>

<button onclick="novoJogo()">Novo Jogo</button>
<button onclick="novoLevel()">Novo Level</button>
<button onclick="gerarCodigo()">Gerar Código Arduino</button>

</header>

<div class="container">

<div id="gameList">

<h3>Jogos / Levels</h3>

<div id="games"></div>

</div>

<div id="editor">

<div id="blocklyDiv"></div>

<pre id="codigo"></pre>

</div>

</div>

<xml id="toolbox" style="display:none">

<category name="Controle">

<block type="controls_if"></block>
<block type="controls_repeat_ext"></block>

</category>

<category name="Lógica">

<block type="logic_compare"></block>
<block type="logic_operation"></block>
<block type="logic_boolean"></block>

</category>

<category name="Matemática">

<block type="math_number"></block>
<block type="math_arithmetic"></block>

</category>

<category name="Arduino">

<block type="delay_block"></block>
<block type="digital_write"></block>

</category>

<category name="Jogos">

<block type="player_move"></block>
<block type="check_collision"></block>

</category>

</xml>

<script>

var workspace = Blockly.inject('blocklyDiv',
{toolbox: document.getElementById('toolbox')});

let jogos = [];
let jogoAtual = null;

function atualizarLista(){

let div = document.getElementById("games");
div.innerHTML="";

jogos.forEach((g,i)=>{

let item=document.createElement("div");
item.className="gameItem";
item.innerText="ID "+g.id+" - "+g.nome;

item.onclick=()=>carregarJogo(i);

div.appendChild(item);

});

}

function novoJogo(){

let nome=prompt("Nome do jogo");
let id=jogos.length;

jogos.push({id:id,nome:nome,xml:null});

atualizarLista();

}

function novoLevel(){

let nome=prompt("Nome do level");
let id=jogos.length;

jogos.push({id:id,nome:nome,xml:null});

atualizarLista();

}

function carregarJogo(i){

jogoAtual=i;

workspace.clear();

if(jogos[i].xml){

let xml=Blockly.Xml.textToDom(jogos[i].xml);
Blockly.Xml.domToWorkspace(xml,workspace);

}

}

workspace.addChangeListener(()=>{

if(jogoAtual!=null){

let xml=Blockly.Xml.workspaceToDom(workspace);
jogos[jogoAtual].xml=Blockly.Xml.domToText(xml);

}

});

function gerarCodigo(){

let codigo="int gameID=0;\n\n";

jogos.forEach(g=>{

codigo+="void game"+g.id+"(){\n";

codigo+="// lógica do jogo\n";

codigo+="}\n\n";

});

codigo+="void loop(){\n";

codigo+="switch(gameID){\n";

jogos.forEach(g=>{

codigo+="case "+g.id+": game"+g.id+"(); break;\n";

});

codigo+="}\n}\n";

document.getElementById("codigo").textContent=codigo;

}

Blockly.Blocks['delay_block']={
init:function(){
this.appendDummyInput()
.appendField("delay ms")
.appendField(new Blockly.FieldNumber(100),"TIME");
this.setPreviousStatement(true);
this.setNextStatement(true);
this.setColour(160);
}
};

Blockly.Blocks['digital_write']={
init:function(){
this.appendDummyInput()
.appendField("digitalWrite pin")
.appendField(new Blockly.FieldNumber(13),"PIN")
.appendField("state")
.appendField(new Blockly.FieldDropdown([["HIGH","HIGH"],["LOW","LOW"]]),"STATE");
this.setPreviousStatement(true);
this.setNextStatement(true);
this.setColour(160);
}
};

Blockly.Blocks['player_move']={
init:function(){
this.appendDummyInput()
.appendField("mover jogador");
this.setPreviousStatement(true);
this.setNextStatement(true);
this.setColour(200);
}
};

Blockly.Blocks['check_collision']={
init:function(){
this.appendDummyInput()
.appendField("checar colisão");
this.setOutput(true);
this.setColour(200);
}
};

</script>

</body>
</html>
